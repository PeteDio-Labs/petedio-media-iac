# Nightly Plane reconcile for this repo. The reusable job lives in petedio-iac; this
# file is the whole of what a repo needs, exactly like plane-sync.yml beside it.
#
# ⚠ WHY EVERY REPO NEEDS ITS OWN (PET-363). A reusable workflow reads
# `github.repository` and `github.token` from the CALLER, so a repo with no caller is
# never reconciled by anyone. Until 2026-09-06 only petedio-iac had one, and the job
# reported green nightly while covering 1 of 11 repos — stranding PET-331 for two days
# and PET-289 for nineteen, both closed by hand in the end.
#
# It is inert until PLANE_BASE_URL / PLANE_WORKSPACE / PLANE_PROJECT_ID are set:
# scripts/plane-sync.sh warns and exits 0 when they are missing, so this can never
# break this repo's CI.
#
# ⚠ The cron minute is staggered per repo. Eleven repos firing at once queue behind two
# self-hosted x64 runners, and a queued nightly that misses its window is a reconciler
# that did not run. Do not copy this minute into a twelfth repo — pick a free one.
name: plane-reconcile

on:
  schedule:
    - cron: "22 8 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of merged PRs to re-check"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  reconcile:
    uses: PeteDio-Labs/petedio-iac/.github/workflows/plane-reconcile.yml@main
    permissions:
      contents: read
      id-token: write
      # ⚠ REQUIRED, AND THE REUSABLE JOB CANNOT ADD IT FOR US (PET-430). plane-reconcile
      # lists pull requests, which needs the Pull requests permission. A called workflow
      # can only NARROW what its caller grants, never widen it — so this line has to exist
      # here, in every one of the eleven repos that calls it.
      #
      # ⚠ AND IT MUST LAND BEFORE the reusable workflow starts asking for it. A job
      # requesting more than its caller granted does not fail — it never STARTS
      # (`startup_failure`), and a run that never starts writes no log at all. Measured,
      # not assumed. Until petedio-iac's side lands this line is a harmless no-op: the
      # called job still strips the scope.
      pull-requests: read
    with:
      lookback_days: ${{ github.event.inputs.lookback_days || '3' }}
