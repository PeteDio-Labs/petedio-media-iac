# Workflow B — GitOps / IaC (plan-on-PR, apply-on-merge) for the media stack.
# Runs on the self-hosted runner (VM 232) INSIDE the homelab, so it can reach the
# Proxmox API (.10:8006) and the MinIO state backend (.221:9000) — a GitHub-hosted
# runner cannot route to 192.168.50.0/24.
#
# Unlike petedio-iac, Terraform here uses NO `vault` provider (media TF is pure
# LXC capture), so there's no VAULT_* env or token export — vault-action just
# mints the MinIO + Proxmox + ssh creds via OIDC (no static GitHub secrets).
#
# SAFETY: apply-on-merge is intentionally CONSERVATIVE for brownfield capture —
# do not enable auto-apply until the imports land a clean no-op plan and the state
# is in MinIO. Until then this workflow plans on PR and the apply step is a no-op
# fast-path (nothing to apply on a zero-drift state). See docs/GOTCHAS.md.
#
# PREREQ: the `media-ci` JWT role must exist in Vault (petedio-iac
# vault-config/auth.tf, applied by the operator with the root token) before this
# workflow can mint a token. Until then Init fails with "No valid credential
# sources found".
name: terraform

on:
  pull_request: {}
  push:
    branches: [main]

env:
  TF_IN_AUTOMATION: "1"
  # Creds come ENTIRELY from the Vault-OIDC step below — no static GitHub secrets
  # in this repo. (The AWS_*/TF_VAR_* names are populated into $GITHUB_ENV by
  # vault-action with exportEnv:true, for the init/plan/apply steps that follow.)

permissions:
  contents: read
  pull-requests: write # to post the plan as a PR comment
  id-token: write # mint the GitHub OIDC token vault-action exchanges for a Vault token

jobs:
  tf:
    runs-on: [self-hosted, linux, x64, homelab]
    defaults:
      run:
        working-directory: environments/media
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # vault-action's `caCertificate` wants BASE64-encoded PEM, and a `with:`
      # value can't read a file — so emit the committed self-signed Vault CA
      # (environments/media/vault-ca.crt, relative to working-directory) as a
      # base64 step output. We verify TLS against this CA, never tlsSkipVerify.
      - name: Encode Vault CA
        id: vault_ca
        shell: bash
        run: echo "b64=$(base64 -w0 vault-ca.crt)" >> "$GITHUB_OUTPUT"

      # Exchange the GitHub Actions OIDC token for a short-lived Vault token (JWT
      # auth, role media-ci) and export the backend/provider creds as env for the
      # init/plan/apply steps. jwtGithubAudience MUST equal var.github_oidc_audience
      # in petedio-iac vault-config. The JWT backend is mounted at jwt-github/ (not
      # the default jwt/), so `path` must be set explicitly.
      - name: Vault — mint creds via OIDC
        uses: hashicorp/vault-action@v3
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: media-ci
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportEnv: true
          secrets: |
            kv/data/iac/minio access_key | AWS_ACCESS_KEY_ID ;
            kv/data/iac/minio secret_key | AWS_SECRET_ACCESS_KEY ;
            kv/data/iac/proxmox api_token | TF_VAR_proxmox_api_token ;
            kv/data/iac/lxc-ssh public_key | TF_VAR_ssh_public_key

      - name: Init
        run: terraform init -input=false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        id: plan
        shell: bash
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: ${{ always() && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/media/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)...' : plan;
            const failed = '${{ steps.plan.outcome }}' === 'failure';
            const header = failed
              ? '#### `terraform plan` — media ❌ **plan failed** (error below)'
              : '#### `terraform plan` — media ✅';
            const body = [header, '```hcl', truncated, '```'].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Apply-on-merge is OPT-IN for the brownfield capture: gated behind the repo
      # variable MEDIA_APPLY_ENABLED == 'true'. Until then, merges only run init/
      # validate (plan is PR-only) and never apply — so the qbittorrent-vpn
      # dual-state caveat (old homelab-infra TF still manages 110) can't cause an
      # unintended apply. Flip the variable on once the old-side state rm is done
      # and you're ready for apply-on-merge. See docs/GOTCHAS.md.
      - name: Apply
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.MEDIA_APPLY_ENABLED == 'true' }}
        run: terraform apply -input=false -auto-approve
