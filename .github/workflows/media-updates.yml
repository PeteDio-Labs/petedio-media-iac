# media-updates.yml — check for, or apply, media-stack updates on request (PET-395).
#
# DISPATCH-ONLY. pete-bot's /update starts it through the REST API with a token that can
# run workflows in this repo and nothing else. There is no push, pull_request or
# schedule trigger, so no merge and no pull request can start an update. The Vault role
# it mints, media-updates (petedio-iac vault-config), is bound to this file, to main and
# to workflow_dispatch, so no other workflow can mint it either.
#
# INPUTS ARE CHOICES, NEVER FREE TEXT. `target` maps to a fixed --limit below, and
# request_id is refused unless it is a short token, so nothing a caller sends reaches a
# command line. pete-bot's /update offers the same target list; keep the two in step.
#
# ⚠ media-base is skipped (--skip-tags baseline). An update run never converges host
# baseline; see the note on the media-base play in ansible/playbooks/media-roles.yml.
#
# ⚠ THE REPORT MARKERS ARE A CONTRACT. pete-bot reads the report back from this job's
# log, between the two marker lines printed at the end of the run step. Change them in
# pete-bot's src/clients/githubActions.ts at the same time, or /update loses its report.
#
# To run it by hand: Actions > media-updates > Run workflow, or
#   gh workflow run media-updates.yml -f mode=check -f target=plex-and-arr
name: media-updates
run-name: media-updates ${{ inputs.mode }} ${{ inputs.target }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      mode:
        description: check reports what is available and changes nothing; apply updates
        type: choice
        options: [check, apply]
        default: check
      target:
        description: Which services
        type: choice
        options: [plex, sonarr, radarr, prowlarr, arr, plex-and-arr]
        default: plex-and-arr
      force:
        description: Plex only. Update even while someone is watching, or when that cannot be told
        type: boolean
        default: false
      request_id:
        description: The caller's id, echoed in the run name so the caller can find this run
        type: string
        default: manual

# One update at a time across the stack. A second dispatch waits rather than racing the
# first over the same hosts.
concurrency:
  group: media-updates
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token vault-action exchanges for a Vault token

jobs:
  run:
    # ⚠ PIN x64. [self-hosted, homelab] also matches pete-pi-1, which is arm64.
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve the target to a fixed --limit
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          case "$TARGET" in
            plex)                   limit=plex-gpu ;;
            sonarr|radarr|prowlarr) limit="$TARGET" ;;
            arr)                    limit=servarr ;;
            plex-and-arr)           limit=plex-gpu:servarr ;;
            *) echo "::error title=media-updates::unknown target '$TARGET'"; exit 1 ;;
          esac
          if [[ ! "$REQUEST_ID" =~ ^[A-Za-z0-9-]{1,40}$ ]]; then
            echo "::error title=media-updates::request_id must be 1-40 letters, digits or dashes"; exit 1
          fi
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "target $TARGET -> --limit $limit"

      # Vault seals on every reboot of .223. Say so plainly rather than as vault-action's
      # 503. Copied from terraform.yml's apply job.
      - name: Vault — preflight (reachable and unsealed?)
        shell: bash
        run: |
          set -uo pipefail
          if ! seal="$(curl -sS --cacert environments/media/vault-ca.crt --max-time 15 \
                        https://192.168.50.223:8200/v1/sys/seal-status 2>&1)"; then
            echo "::error title=Vault unreachable::Could not reach https://192.168.50.223:8200 from the runner. curl: ${seal}"
            exit 1
          fi
          case "$seal" in
            *'"sealed":true'*)
              echo "::error title=Vault is sealed::Vault (.223) is sealed, so this run cannot mint its SSH key. Unseal it (petedio-iac docs/runbooks/vault-resilience.md) and run again."
              exit 1 ;;
          esac

      - name: Encode Vault CA
        id: vault_ca
        shell: bash
        run: echo "b64=$(base64 -w0 environments/media/vault-ca.crt)" >> "$GITHUB_OUTPUT"

      # media-updates reads kv/iac/lxc-ssh and nothing else: no MinIO, no Proxmox, no
      # mtrace key. The block is copied from terraform.yml's apply job, not written fresh.
      - name: Vault — SSH key via OIDC
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github
          role: media-updates
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportEnv: true
          secrets: |
            kv/data/iac/lxc-ssh private_key | ANSIBLE_SSH_KEY

      # Ansible runs in python:3.12-slim from Docker Hub, as petedio-iac's ansible-stack.yml
      # does: the runner has Docker but no pip, and docker.pdlab.dev is gone (PET-389).
      # ansible-core is pinned to the version these plays were last verified on.
      - name: ${{ inputs.mode }} ${{ inputs.target }} (ansible in Docker)
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ steps.target.outputs.limit }}
          FORCE: ${{ inputs.force }}
        run: |
          umask 077
          CI="$RUNNER_TEMP/media-updates"
          rm -rf "$CI"; mkdir -p "$CI/out"
          trap 'rm -rf "$CI"' EXIT
          printf '%s\n' "$ANSIBLE_SSH_KEY" > "$CI/key"; chmod 600 "$CI/key"
          # Extra-vars via a JSON @file, never on argv. The key-file extra-var overrides the
          # inventory's ~/.ssh/id_ed25519_ansible, which does not exist in the container.
          python3 - "$CI/evars.json" <<'PY'
          import json, os, sys
          ev = {"ansible_ssh_private_key_file": "/ci/key",
                "media_update_report_file": "/out/report.txt"}
          if os.environ.get("FORCE") == "true":
              ev["plex_update_force"] = True
          json.dump(ev, open(sys.argv[1], "w"))
          PY
          if [ "$MODE" = apply ]; then
            PLAYBOOK=playbooks/update-media.yml; CHECK=""
          else
            PLAYBOOK=playbooks/check-updates.yml; CHECK="--check"
          fi
          set +e
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ansible:/ansible:ro" -v "$CI:/ci:ro" -v "$CI/out:/out" \
            -w /ansible \
            -e ANSIBLE_CONFIG=/ansible/ansible.cfg \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            -e ANSIBLE_TRANSFORM_INVALID_GROUP_CHARS=ignore \
            python:3.12-slim sh -c \
            "apt-get update -q >/dev/null && apt-get install -y -q openssh-client >/dev/null && \
             pip install -q 'ansible-core==2.20.4' && \
             ansible-galaxy collection install -r requirements.yml >/dev/null && \
             n=\$(ansible -i inventory/hosts.yml '$LIMIT' --list-hosts | sed -n 's/.*hosts (\([0-9]*\)).*/\1/p') && \
             if [ \"\${n:-0}\" -eq 0 ]; then echo 'ABORT: --limit $LIMIT matches no host'; exit 1; fi && \
             ansible-playbook -i inventory/hosts.yml $PLAYBOOK $CHECK --limit '$LIMIT' \
               --skip-tags baseline -e @/ci/evars.json"
          rc=$?
          set -e
          m="===== MEDIA UPDATE REPORT"
          echo "$m BEGIN ====="
          if [ -s "$CI/out/report.txt" ]; then cat "$CI/out/report.txt"
          else echo "No report: the run stopped before the report play (ansible exit $rc)."; fi
          echo "$m END ====="
          { echo '```'; cat "$CI/out/report.txt" 2>/dev/null || echo "no report (ansible exit $rc)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
