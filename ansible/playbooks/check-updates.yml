# Report the current and available version of every media service. It upgrades
# nothing (`media_update_apply: false`), but the roles still converge config, as
# configure-media.yml does.
#
# On qbittorrent-vpn that includes rendering .env from Vault (PET-453). The render
# needs an unsealed Vault and the `ansible` AppRole files, and Vault seals nightly.
# To run without them, pass --skip-tags qbit_env. Before you schedule this
# playbook, read RESTART HAZARD in roles/qbittorrent-vpn/tasks/main.yml.
#
#   cd ansible
#   ansible-playbook -i inventory/hosts.yml playbooks/check-updates.yml
#
# Limit to one service the usual way:
#   ... playbooks/check-updates.yml --limit plex-gpu
---
- name: Media stack — check for updates
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Report mode
      ansible.builtin.debug:
        msg: "Version check. Nothing is upgraded."

- ansible.builtin.import_playbook: media-roles.yml
  vars:
    media_update_apply: false
