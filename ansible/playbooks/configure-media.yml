# Converge the media hosts to their captured configuration state.
#
#   cd ansible
#   ansible-playbook -i inventory/hosts.yml playbooks/configure-media.yml --check
#
# This is the original brownfield-capture entry point, kept because the README
# and PET-46/47 reference it. It now runs the same shared play body as
# check-updates.yml (`media_update_apply: false`) — the roles converge config
# AND report versions in one pass, so the two are deliberately equivalent.
# Use check-updates.yml when what you want is the version report; use
# update-media.yml to actually upgrade.
#
# The per-app roles (servarr / plex / seerr / qbittorrent-vpn) replaced the
# single-host `prowlarr` role that scoped the first idempotent pass.
---
- ansible.builtin.import_playbook: media-roles.yml
  vars:
    media_update_apply: false
