# Configure the media hosts to match their running state (idempotent capture).
# CAPTURE-IN-PLACE: every role asserts what the running community-script LXCs
# already have, so `--check` is a clean no-op across all 7 hosts. Always --check
# FIRST:
#
#   cd ansible
#   ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i inventory/hosts.yml \
#     playbooks/configure-media.yml --check
#
# Scope to one host with `--limit <host>`. The only deliberate live change in this
# repo — qBittorrent's completed-download path (/downloads/completed/) — was
# applied out-of-band and is now captured by the qbittorrent-vpn role, so it too
# is a no-op here (the role only re-asserts on drift). Per-host container timezone
# comes from inventory/host_vars (America/Chicago for lidarr/seerr/sonarr/radarr;
# Etc/UTC for plex/prowlarr/qbit via the media-base default).
---
- name: Media base (all media hosts)
  hosts: media
  gather_facts: true
  roles:
    - media-base

- name: Lidarr
  hosts: lidarr
  gather_facts: false
  roles:
    - lidarr

- name: Sonarr
  hosts: sonarr
  gather_facts: false
  roles:
    - sonarr

- name: Radarr
  hosts: radarr
  gather_facts: false
  roles:
    - radarr

- name: Prowlarr
  hosts: prowlarr
  gather_facts: false
  roles:
    - prowlarr

- name: Plex
  hosts: plex
  gather_facts: false
  roles:
    - plex

- name: Seerr
  hosts: seerr
  gather_facts: false
  roles:
    - seerr

- name: VPN torrent stack (qBittorrent)
  hosts: qbittorrent-vpn
  gather_facts: false
  roles:
    - qbittorrent-vpn
