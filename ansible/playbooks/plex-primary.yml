---
# plex-primary.yml — choose which Plex serves the house, and enforce it. (PET-311)
#
# ⚠ THERE IS ONLY ONE PLEX, SO THERE IS NO FAILOVER RIGHT NOW (PET-354).
# This playbook was written for two servers reading one library: plex (103) on
# pve01 and plex-gpu (236) on pve02, exactly one running at a time. pve01 died on
# 2026-09-03 and 103 was not rebuilt, so the cold spare is gone. What survives is
# the half that still means something: assert that plex-gpu is enabled and running.
#
# The `-e plex_primary=plex` failover below CANNOT WORK — that host is no longer in
# the inventory. It is documented rather than deleted because the two-server design
# is still the right answer and is worth restoring; restoring it needs a second Plex
# to exist first. Until then, treat 236 as a single point of failure for playback.
#
# NORMAL STATE — plex-gpu serves:
#
#     ansible-playbook playbooks/plex-primary.yml
#
# Add -e plex_primary_force=true to demote a server that is mid-stream.
#
# The library is read-only shared and each server keeps its own database, so
# flipping back and forth is safe once a second server exists again. Watched state
# lives on your Plex account rather than on either server, so it follows you across
# the switch. Resume positions do NOT — they are per-server.

- name: Enforce which Plex is the primary
  hosts: plex-gpu
  become: true
  gather_facts: false
  ignore_unreachable: true
  roles:
    - plex-primary
