# Power the media LXCs themselves off/on at the Proxmox level, to actually
# reclaim RAM and CPU on their node (stack-down.yml only stops services; the
# containers keep their memory).
#
#   cd ansible
#   ansible-playbook -i inventory/hosts.yml playbooks/stack-power.yml -e power=off
#   ansible-playbook -i inventory/hosts.yml playbooks/stack-power.yml -e power=on
#
# `off` runs stack-down.yml's graceful service shutdown FIRST — pulling the
# container out from under a running Plex transcode or an active torrent is how
# you corrupt a library database. `on` starts the containers, then hands over to
# stack-up.yml for the ordered service start and the VPN leak check.
#
# WHY NOT TERRAFORM: the LXC module deliberately keeps `started` in
# lifecycle.ignore_changes (see modules/proxmox-lxc/main.tf). Managing run-state
# in Terraform would mean every `plan` reports a stopped container as drift —
# and because CI applies on merge, an unrelated merge could silently boot the
# whole stack back up. Run-state is an operational concern, not a declared one.
---
- name: Validate the requested power state
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require -e power=on|off
      ansible.builtin.assert:
        that: power | default('') in ['on', 'off']
        fail_msg: "Pass -e power=on or -e power=off."

- name: Graceful service shutdown before powering containers off
  ansible.builtin.import_playbook: stack-down.yml
  when: power == 'off'

# ⚠ WHY THIS PLAY EXISTS. `pct shutdown` used to run for all six VMIDs whatever
# stack-down.yml had just concluded, which made the in-use guard decorative on
# this path: the role leaves an in-use host running and says so with a `debug`,
# the host succeeds, and the container was powered off underneath it anyway
# (PET-447). The playbook header calls that out as the way to corrupt a library
# database.
#
# A host reaches this play only if it survived stack-down.yml, because Ansible
# drops a failed host from every later play. So an undefined `media_power_cleared`
# means one of two things, and both of them mean "do not power this off":
#   - the guard returned 'in-use' or 'unknown', so the service never stopped
#   - the stop itself errored, which is the failure PET-447 was filed for
#
# `set_fact` runs on the controller, so this play opens no connection.
- name: Record which hosts the graceful shutdown cleared
  hosts: media:gpu-media
  gather_facts: false
  tasks:
    - name: Mark this host clear to power off
      ansible.builtin.set_fact:
        media_power_cleared: true
      when:
        - power == 'off'
        - media_in_use_state | default('idle') == 'idle'

- name: Power the containers
  hosts: localhost
  gather_facts: false
  vars:
    # vmid -> node, ground-truthed against /cluster/resources 2026-09-06 (PET-354).
    #
    # ⚠ WHY THIS IS A MAP AND NOT A LIST OF VMIDs ON ONE HOST.
    # Until PET-354 this play was `hosts: pve01` looping the VMIDs [103, 101, 104,
    # 105, 100, 109, 110]. Three things had gone wrong with that:
    #   - pve01 does not exist. Its address, 192.168.50.10, answers as pve03 now,
    #     so the play ran against a node it did not name.
    #   - 110 (qbittorrent-vpn) lives on pve02, so `pct shutdown 110` on pve03
    #     failed and the DOWNLOADER STAYED UP through every power-off. The play
    #     reported success because the failed_when clause forgives a non-zero rc.
    #   - 103 (plex) and 100 (lidarr) no longer exist at all, and 236 (plex-gpu,
    #     the only Plex) was never in the list, so Plex was never powered either.
    # The stack has spanned two nodes since PET-334; a single-node loop cannot
    # express it. Ordering still matters across nodes, so this is one ordered
    # loop with each item delegated to its own node.
    #
    # Order mirrors stack-down/up: shut consumers down first, boot producers first.
    #
    # `host` is the inventory hostname, and it is what ties a VMID to the guard
    # verdict recorded above. Without it this loop has no way to ask whether the
    # service on that container actually stopped (PET-447).
    media_power_shutdown_order:
      - { vmid: 236, node: pve02, host: plex-gpu }         # consumer
      - { vmid: 101, node: pve03, host: seerr }            # consumer
      - { vmid: 104, node: pve03, host: sonarr }           # importer
      - { vmid: 105, node: pve03, host: radarr }           # importer
      - { vmid: 109, node: pve03, host: prowlarr }         # indexer
      - { vmid: 110, node: pve02, host: qbittorrent-vpn }  # downloader
  tasks:
    - name: Stop the media containers
      ansible.builtin.command: "pct shutdown {{ item.vmid }} --timeout 120"
      delegate_to: "{{ item.node }}"
      loop: "{{ media_power_shutdown_order }}"
      when:
        - power == 'off'
        - hostvars[item.host]['media_power_cleared'] | default(false) | bool
      register: pct_stop
      changed_when: pct_stop.rc == 0
      # A container that is already stopped exits non-zero; that is success here.
      # It does NOT forgive "does not exist" — that means this map is stale, and
      # a stale map is exactly the failure PET-354 found. Fail on it.
      failed_when:
        - pct_stop.rc != 0
        - "'not running' not in (pct_stop.stderr | default('') | lower)"

    - name: Start the media containers
      ansible.builtin.command: "pct start {{ item.vmid }}"
      delegate_to: "{{ item.node }}"
      loop: "{{ media_power_shutdown_order | reverse | list }}"
      when: power == 'on'
      register: pct_start
      changed_when: pct_start.rc == 0
      failed_when:
        - pct_start.rc != 0
        - "'already running' not in (pct_start.stderr | default('') | lower)"

- name: Report container states on both nodes
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Read container states
      ansible.builtin.command: "pct list"
      register: pct_list
      changed_when: false

    - name: Show media container states
      ansible.builtin.debug:
        msg: "{{ pct_list.stdout_lines | select('search', '(101|104|105|109|110|236)') | list }}"

# Containers need a moment for sshd before Ansible can reach them; stack-up's
# per-tier port waits absorb the rest.
# media:gpu-media, not media: 236 is in gpu-media, so `hosts: media` skipped the
# one container that had just been started and handed straight to stack-up.yml,
# which then reached for a Plex whose sshd might not be listening (PET-447).
- name: Wait for the containers to accept SSH
  hosts: media:gpu-media
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: power == 'on'

- name: Ordered service start after power-on
  ansible.builtin.import_playbook: stack-up.yml
  when: power == 'on'

# ------------------------------------------------------------------------------
# A held container is not a clean power-off, and must not look like one: the RAM
# you asked for is still committed. This play is separate, and last, so the
# `pct list` report above still prints — that report is the most useful thing to
# read when something was held.
- name: Refuse to report a clean power-off when a container was held
  hosts: localhost
  gather_facts: false
  vars:
    # Loop items whose condition was false. Derived from what the loop did rather
    # than recomputed, so the two can never disagree.
    media_power_held: >-
      {{ (pct_stop | default({})).results | default([])
         | selectattr('skipped', 'defined') | map(attribute='item') | list }}
  tasks:
    - name: Name each container the guard held
      ansible.builtin.debug:
        msg: >-
          {{ item.host }} ({{ item.vmid }} on {{ item.node }}) left powered on:
          {{ hostvars[item.host]['media_in_use_reason']
             | default('its service shutdown failed, so nothing cleared it') }}
      loop: "{{ media_power_held }}"
      loop_control:
        label: "{{ item.host }}"
      when: power == 'off'

    - name: Fail, because the stack is not powered off
      ansible.builtin.fail:
        msg: >-
          {{ media_power_held | length }} of
          {{ (pct_stop | default({})).results | default([]) | length }} containers
          are still running:
          {{ media_power_held | map(attribute='host') | join(', ') }}.
          Their services were not cleared, so `pct shutdown` was not run for them.
          Re-run with -e media_lifecycle_force=true to power them off anyway.
      when:
        - power == 'off'
        - media_power_held | length > 0
