---
# bootstrap-plex-remote.yml — first-run install of Plex on 244 (pve03), the Plex
# that serves remote users only (MED-11). The same role as bootstrap-plex-gpu.yml,
# with host_vars/plex-remote.yml pointing it at the Iris Xe's render node.
#
# ORDER, after the apply-on-merge creates 244:
#
#     scripts/lxc-oob-244.sh                                  # bind, render node
#     ansible-playbook playbooks/bootstrap-plex-remote.yml    # install
#     scripts/plex-claim-244.sh                               # claim, as Pedro
#     ansible-playbook playbooks/bootstrap-plex-remote.yml    # again: the scan schedule needs the token
#     ansible-playbook playbooks/configure-plex-remote.yml    # libraries, caps, remote access
#
# Run it from a machine that reaches pve03: the inventory jumps through it.

- name: Bootstrap Plex on plex-remote 244
  hosts: plex-remote
  become: true
  roles:
    - plex-bootstrap
