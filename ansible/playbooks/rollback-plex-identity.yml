---
# Give the Plex identity back to plex-gpu 236 (MED-11), the reverse of
# migrate-plex-identity.yml. It stops 244 first, so the identity never runs twice.
#
# It works only while 236's data directory is still aside, which is until
# reset-plex-gpu.yml has started 236 clean. After that, 236 holds a second
# server's data, and this play refuses rather than mix the two.
#
# It does not give 236 its address back. If pve03 already holds 192.168.86.236,
# revert the cutover PR first, so 236 owns 192.168.86.236 again, and run
# configure-plex-remote-net.yml with plex_remote_net_takeover_ip empty.
#
#   ansible-playbook -i inventory/hosts.yml playbooks/rollback-plex-identity.yml \
#     -e plex_migrate_confirm=yes </dev/null 2>&1 | cat

- name: Roll back the Plex identity — stop 244
  hosts: plex-remote
  become: true
  any_errors_fatal: true
  gather_facts: false
  vars_files:
    - vars/plex-migrate.yml
  tasks:
    - name: Refuse a real run without the confirmation
      ansible.builtin.assert:
        that:
          - ansible_check_mode or (plex_migrate_confirm | default('')) == 'yes'
        fail_msg: Re-run with -e plex_migrate_confirm=yes, or add --check to rehearse.

    - name: Stop and disable Plex on 244
      ansible.builtin.systemd_service:
        name: plexmediaserver
        enabled: false
        state: stopped

- name: Roll back the Plex identity — start 236 with its own data
  hosts: plex-gpu
  become: true
  any_errors_fatal: true
  gather_facts: false
  vars_files:
    - vars/plex-migrate.yml
  tasks:
    - name: Read 236's live data directory
      ansible.builtin.stat:
        path: "{{ plex_migrate_base }}/{{ plex_migrate_dir }}"
      register: plex_rollback_live

    - name: Read 236's aside copy
      ansible.builtin.stat:
        path: "{{ plex_migrate_base }}/{{ plex_migrate_src_aside }}"
      register: plex_rollback_aside

    - name: Refuse when 236 already runs a second server
      ansible.builtin.assert:
        that:
          - not (plex_rollback_live.stat.exists and plex_rollback_aside.stat.exists)
        fail_msg: >-
          236 holds both a live data directory and the aside copy, so
          reset-plex-gpu.yml has run and 236 is a second server. This play will
          not choose between the two. Decide which server 236 runs first.

    - name: Put 236's data directory back
      ansible.builtin.command:
        argv:
          - mv
          - "{{ plex_migrate_base }}/{{ plex_migrate_src_aside }}"
          - "{{ plex_migrate_base }}/{{ plex_migrate_dir }}"
        creates: "{{ plex_migrate_base }}/{{ plex_migrate_dir }}"
      when: plex_rollback_aside.stat.exists

    - name: Enable and start Plex on 236
      ansible.builtin.systemd_service:
        name: plexmediaserver
        enabled: true
        state: started
