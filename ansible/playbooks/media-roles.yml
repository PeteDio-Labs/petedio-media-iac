# Shared play body for the media stack. Both check-updates.yml and
# update-media.yml import this and differ ONLY in `media_update_apply` — so the
# thing you dry-run is byte-for-byte the thing that then applies.
#
# Every role ends by setting a `media_update_report` fact with a common shape:
#   { service, mechanism, current, available, update_available, [updated, note] }
# The report play at the bottom is the only consumer, so adding a new service is
# "write a role that sets that fact" and nothing else changes.
---
- name: Media base (all media hosts)
  hosts: media
  gather_facts: true
  roles:
    - media-base

- name: Servarr apps (sonarr / radarr / prowlarr)
  hosts: servarr
  gather_facts: false
  roles:
    - servarr

# ⚠ DISABLED, NOT DELETED — this play has no host (PET-354).
# It applied the `plex` role to plex (103), which died with pve01 on 2026-09-03.
# The only Plex is plex-gpu (236), and it is NOT a drop-in target: 103 was captured
# in place by the `plex` role, while 236 is built by bootstrap-plex-gpu.yml. Whether
# the `plex` role can assert 236 without fighting that bootstrap is an open question,
# so retargeting it is a decision, not a rename. Until it is answered, `hosts: plex`
# would silently match nothing and report success — the failure mode this audit was
# convened to remove. Left commented so the omission is visible.
# - name: Plex
#   hosts: plex-gpu
#   gather_facts: false
#   roles:
#     - plex

- name: Seerr
  hosts: seerr
  gather_facts: false
  roles:
    - seerr

- name: qBittorrent + Gluetun stack
  hosts: qbittorrent-vpn
  gather_facts: false
  roles:
    - qbittorrent-vpn

- name: Update report
  hosts: media
  gather_facts: false
  tasks:
    - name: Render the media stack update report
      run_once: true
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: "{{ lookup('template', '../templates/update-report.j2').split('\n') }}"
