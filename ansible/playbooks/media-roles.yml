# Shared play body for the media stack. Both check-updates.yml and
# update-media.yml import this and differ ONLY in `media_update_apply` — so the
# thing you dry-run is byte-for-byte the thing that then applies.
#
# Every role ends by setting a `media_update_report` fact with a common shape:
#   { service, mechanism, current, available, update_available, [updated, note] }
# The report play at the bottom is the only consumer, so adding a new service is
# "write a role that sets that fact" and nothing else changes.
---
- name: Media base (all media hosts)
  hosts: media
  gather_facts: true
  roles:
    - media-base

- name: Servarr apps (sonarr / radarr / prowlarr)
  hosts: servarr
  gather_facts: false
  roles:
    - servarr

# plex-gpu (236), the only Plex since 103 died with pve01 on 2026-09-03.
#
# PET-354 left this play commented out over one open question: would the `plex`
# role fight bootstrap-plex-gpu.yml, which built 236? It does not (PET-394). The
# role owns the service state and the package upgrade; the bootstrap owns the apt
# source, the signing key and the scan settings; plex-settings owns the playback
# limits. Measured against 236 on 2026-09-10: the read-only path reports
# changed=0, and the apply path took 236 from 1.43.3 to 1.43.4 with the library,
# GPU access and apt configuration unchanged.
#
# 236 stays outside the `media` group, so media-base does not converge it. This
# play names the host instead; folding it into `media` is a separate decision.
- name: Plex
  hosts: plex-gpu
  gather_facts: false
  roles:
    - plex

- name: Seerr
  hosts: seerr
  gather_facts: false
  roles:
    - seerr

- name: qBittorrent + Gluetun stack
  hosts: qbittorrent-vpn
  gather_facts: false
  roles:
    - qbittorrent-vpn

# gpu-media is listed so the report still renders under --limit plex-gpu. With
# `hosts: media` alone that limit matched nothing here, and the run ended with no
# report at all.
- name: Update report
  hosts: media:gpu-media
  gather_facts: false
  tasks:
    - name: Render the media stack update report
      run_once: true
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: "{{ lookup('template', '../templates/update-report.j2').split('\n') }}"
