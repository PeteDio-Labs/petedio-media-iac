# Bring the media stack DOWN, gracefully, in dependency order.
#
#   cd ansible
#   ansible-playbook -i inventory/hosts.yml playbooks/stack-down.yml
#
# Order is consumers-before-producers, so nothing is stopped mid-handoff:
#
#   1. plex + seerr      user-facing — stop first so nobody is cut off mid-action
#   2. sonarr/radarr   importers — they consume from qBittorrent
#   3. prowlarr          indexer — the *arr apps query it, so it outlives them
#   4. qbittorrent-vpn   downloader — last, so imports upstream have settled
#
# Plex and qBittorrent REFUSE to stop while genuinely in use (someone watching,
# something downloading) and say so. Force with:
#   -e media_lifecycle_force=true
#
# This stops services, not containers — the LXCs stay up so `stack-up.yml` is
# near-instant. To power the containers off entirely, use stack-power.yml.
---
# plex-gpu (236), not plex (103): 103 died with pve01 on 2026-09-03 and 236 is the
# only Plex. Retargeted in PET-354 — the old value matched no host, and Ansible
# skips an unmatched pattern with a warning, so the stack reported a clean
# shutdown while Plex kept running.
- name: Media stack down — 1/4 user-facing (plex-gpu, seerr)
  hosts: plex-gpu,seerr
  gather_facts: false
  vars:
    media_lifecycle_state: stopped
  roles:
    - media-lifecycle

- name: Media stack down — 2/4 importers (sonarr, radarr)
  hosts: sonarr,radarr
  gather_facts: false
  vars:
    media_lifecycle_state: stopped
  roles:
    - media-lifecycle

- name: Media stack down — 3/4 indexer (prowlarr)
  hosts: prowlarr
  gather_facts: false
  vars:
    media_lifecycle_state: stopped
  roles:
    - media-lifecycle

- name: Media stack down — 4/4 downloader (qbittorrent-vpn)
  hosts: qbittorrent-vpn
  gather_facts: false
  vars:
    media_lifecycle_state: stopped
  roles:
    - media-lifecycle

- name: Media stack down — report
  hosts: media
  gather_facts: false
  tasks:
    - name: Summarise
      run_once: true
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: >-
          Media stack stopped. LXCs are still running — `stack-up.yml` brings the
          services back. Use stack-power.yml to power the containers off.
