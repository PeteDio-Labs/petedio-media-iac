# plex 103/.140 (also 192.168.86.140 on the mesh).
#
# Two Plex apt sources were configured on this host. `plexmediaserver.sources`
# (repo.plex.tv) is the current one and stays. `plex.list` (downloads.plex.tv)
# is a legacy leftover pinned to the 1.42.2 line — dead weight today because apt
# takes the highest version, but a real downgrade risk the moment the current
# repo is unreachable or something pins to it. Removed here.
---
media_timezone: "Etc/UTC"

media_base_stale_apt_sources:
  - plex.list

# Lifecycle (stack-up / stack-down / stack-power)
# The unit is plexmediaserver, not the inventory hostname.
media_service_unit: plexmediaserver
media_health_port: 32400

# Host facts, declared here rather than only in roles/plex/defaults because the
# media-lifecycle role needs the same values for its "is anyone watching?" probe.
# host_vars beats role defaults, so this stays the single source for both.
plex_port: 32400
plex_prefs_path: >-
  /var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Preferences.xml
