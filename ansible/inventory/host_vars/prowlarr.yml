# prowlarr 109/.20 — indexers. v1 API. Runs as the dedicated `prowlarr` user
# (the other three run as root/uid-1001), which the built-in updater handles —
# /opt/Prowlarr is owned prowlarr:prowlarr so it can swap its own tree.
---
servarr_api_version: "v1"

# Genuinely UTC — unlike its three siblings. The mixed timezones across this
# stack are organic (different installers, different days), not a decision.
media_timezone: "Etc/UTC"

# Lifecycle (stack-up / stack-down / stack-power)
media_health_port: 9696

# ⚠ THE systemd-logind MASK WAS REMOVED HERE ON 2026-09-09, AND THE ROOT CAUSE IS
# FIXED. Do not put it back without reading this first.
#
# logind died with 226/NAMESPACE because CT 109 was the one container in the lab
# with no `nesting=1`. Without it Proxmox writes `deny mount -> /proc/,` into the
# generated AppArmor profile, so a unit with ProtectSystem=strict cannot build its
# sandbox. PAM then waited 25 s for it on every login. PET-378 declared the features
# (petedio-iac roles/lxc-features) and 109 was restarted onto them.
#
# Measured after the restart: logind active with its full sandbox intact, ZERO failed
# units where there were four, and `ssh root@.20 true` at 0.19-0.24 s against 25.2 s
# before. The mask was a workaround for a container misconfiguration, not a property
# of this host.
#
# If logind breaks here again, check `pct config 109` for its features before masking
# anything — that is the cause you already know about.
media_base_masked_units: []
