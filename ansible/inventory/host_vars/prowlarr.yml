# prowlarr 109/.20 — indexers. v1 API. Runs as the dedicated `prowlarr` user
# (the other three run as root/uid-1001), which the built-in updater handles —
# /opt/Prowlarr is owned prowlarr:prowlarr so it can swap its own tree.
---
servarr_api_version: "v1"

# Genuinely UTC — unlike its three siblings. The mixed timezones across this
# stack are organic (different installers, different days), not a decision.
media_timezone: "Etc/UTC"

# Lifecycle (stack-up / stack-down / stack-power)
media_health_port: 9696

# ⚠ THE systemd-logind MASK WAS REMOVED HERE ON 2026-09-09, AND THE ROOT CAUSE IS
# FIXED. Do not put it back without reading this first.
#
# logind died with 226/NAMESPACE because CT 109 was the one container in the lab
# with no `nesting=1`. Without it Proxmox writes `deny mount -> /proc/,` into the
# generated AppArmor profile, so a unit with ProtectSystem=strict cannot build its
# sandbox. PAM then waited 25 s for it on every login. PET-378 declared the features
# (petedio-iac roles/lxc-features) and 109 was restarted onto them.
#
# Measured after the restart: logind active with its full sandbox intact, ZERO failed
# units where there were four, and `ssh root@.20 true` at 0.19-0.24 s against 25.2 s
# before. The mask was a workaround for a container misconfiguration, not a property
# of this host.
#
# If logind breaks here again, check `pct config 109` for its features before masking
# anything — that is the cause you already know about.
media_base_masked_units: []

# ---------------------------------------------------------------- indexers --
# Prowlarr's indexer settings, declared (PET-296). Until PET-296 they were set
# through the API on 2026-08-14 and existed only in the vault note
# Practices/indexers-and-fake-releases.md, so a rebuild would have restored the
# fake-release indexers. roles/servarr/tasks/indexers.yml reads each indexer by
# name and writes only the ones that differ. It fails when a name here is missing
# from Prowlarr, rather than skipping it.
#
# Nothing applies this on merge: media-iac runs no Ansible from a push. It is
# also opt-in: the role tags the indexer include `never`, so an update run,
# including one started from Discord, never touches indexers. To apply it, run
# from ansible/ with SSH to CT 109. Add `--check --diff` first for a read-only
# drift report:
#   ansible-playbook playbooks/media-roles.yml --limit prowlarr --tags indexers
servarr_indexers:
  # Disabled on 2026-08-14: it served fake `.exe` releases that filled the
  # downloads volume. ⚠ That cost coverage. LimeTorrents grabbed 10 of the 12
  # Big Brother S28 episodes, so disabling it left the show single-homed on The
  # Pirate Bay, and on 2026-08-17 the show stopped arriving when TPB failed.
  # Re-enabling it is this one line (`enable: true`); Pedro decides.
  LimeTorrents:
    enable: false
    min_seeders: 10
  # The only enabled source since 2026-10-02, and the one US network TV relies on.
  # A floor of 10 seeders rejects low-seeded fakes, but not the 2026-09-29 fakes
  # below, which advertised thousands. ⚠ Every show is now single-homed here, so
  # when TPB fails, nothing arrives (the 2026-08-17 Big Brother outage).
  The Pirate Bay:
    enable: true
    min_seeders: 10
  # Disabled on 2026-10-02 (PET-296): it served all three fake `.exe` releases
  # grabbed on 2026-09-29, each a single 869 MB executable named as a US TV episode.
  # It fed 7 of Sonarr's 369 grabs in the 30 days before, and the library holds no
  # anime. If anime returns, re-enable it with this one line (`enable: true`). Anime is
  # thin on seeders, so the gentler floor of 5 is deliberate.
  Nyaa.si:
    enable: false
    min_seeders: 5
  # Priority-1 private tracker, disabled on 2026-09-04 after its login expired
  # (PET-325). It was never implicated in the fakes, so its seeder floor stays
  # unmanaged.
  leech24:
    enable: false
