# qbittorrent-vpn 110/.21 — Gluetun (ProtonVPN) + qBittorrent + port-sync.
---
# The LXC itself is UTC. Note the *containers* run America/Los_Angeles via TZ in
# docker-compose.yml — a third timezone in this stack. Left as-is; it is the
# container's display setting, not the host's.
media_timezone: "Etc/UTC"

# Lifecycle (stack-up / stack-down / stack-power)
# Driven through docker compose rather than a systemd unit.
media_service_kind: compose
media_health_port: 8080

# Host facts, declared here rather than only in roles/qbittorrent-vpn/defaults
# because the media-lifecycle role needs the same values for its "anything
# downloading?" probe. host_vars beats role defaults — single source for both.
qbit_dir: /opt/qbittorrent-vpn
qbit_env_file: /opt/qbittorrent-vpn/.env

# qbit_api is an IN-CONTAINER url. Both the lifecycle guard and the update guard
# reach it with `docker exec {{ qbit_container }} curl …`, never from the host:
# the WebUI is published through Docker, so a host-origin request is SNAT'd to
# the bridge gateway and falls outside WebUI\AuthSubnetWhitelist. In-namespace
# the source really is 127.0.0.1 and no auth is needed. There is no WebUI
# password to fall back on — see docs/GOTCHAS.md. Do not point this at the LAN IP.
qbit_api: "http://localhost:8080"
qbit_container: qbittorrent
