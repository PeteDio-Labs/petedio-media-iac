# Media stack inventory. Hosts are the RUNNING media LXCs (ground-truthed off
# pve01, 2026-06-04; re-verified 2026-08-11). root over the SSH key Terraform
# installs (id_ed25519_ansible).
# IPs are the LIVE legacy addresses — renumber to 21x is deferred (PET-49).
#
# Excluded: filebrowser (102) — decommission (PET-82).
#
# Hosts are declared once under `media` (which carries the connection vars) and
# re-listed in capability groups below. A host in two groups is fine — the
# capability group is what selects the role, so `--limit servarr` hits exactly
# the four apps that share the Servarr update contract.
---
all:
  children:
    media:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        seerr:
          ansible_host: 192.168.50.33   # VMID 101
        plex:
          ansible_host: 192.168.50.140  # VMID 103 (LAN NIC; also 192.168.86.140 on the mesh)
        sonarr:
          ansible_host: 192.168.50.15   # VMID 104
        radarr:
          ansible_host: 192.168.50.16   # VMID 105
        prowlarr:
          ansible_host: 192.168.50.20   # VMID 109
        qbittorrent-vpn:
          ansible_host: 192.168.50.21   # VMID 110 (Gluetun/Proton)

    # plex-gpu (236) is on pve02, NOT pve01, and is deliberately OUTSIDE the
    # `media` group: that group's roles assume a configured, claimed server, and
    # this one is installed by bootstrap-plex-gpu.yml instead. It has no .86 leg
    # yet (pve02 has one NIC, on .50), so .236 is its only address.
    # It carries a 2xx VMID because it is not part of the pve01 1xx media stack —
    # see the numbering note on module plex_gpu in environments/media/media.tf.
    # Group name deliberately differs from the host name: Ansible warns when a
    # group and a host share one, and the ambiguity is a real trap in --limit.
    gpu-media:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        plex-gpu:
          ansible_host: 192.168.50.236  # VMID 236, pve02, Quick Sync

    # Capability group: the four *arr apps share one install shape (/opt/<App>
    # binary + /var/lib/<app> data + systemd unit) and one update contract
    # (the app's own `builtIn` updater, driven over its REST API), so they are
    # served by a single parametrised `servarr` role.
    servarr:
      hosts:
        sonarr:
        radarr:
        prowlarr:

    # pve01 kept only as an optional recovery jump path (see ansible.cfg) — not
    # managed here.
    proxmox:
      hosts:
        pve01:
          ansible_host: 192.168.50.10
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_proxmox_pedro
