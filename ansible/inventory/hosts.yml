# Media stack inventory. Hosts are the RUNNING media LXCs, ground-truthed against
# `pvesh get /cluster/resources` on both nodes 2026-09-06 (PET-354). root over the
# SSH key Terraform installs (id_ed25519_ansible).
# IPs are the LIVE legacy addresses — renumber to 21x is CANCELED (PET-49), not
# deferred, so these numbers are permanent.
#
# ⚠ THE GUESTS MOVED NODE IN PET-334; THE ADDRESSES DID NOT.
# Nothing in this file depends on the node, but plenty of prose elsewhere did, so
# state it once here:
#
#   pve03  192.168.50.10  seerr 101 · flaresolverr 102 · sonarr 104 · radarr 105
#                          · prowlarr 109   (+ the whole platform tier)
#   pve02  192.168.50.11  qbittorrent-vpn 110 · plex-gpu 236   (+ runner-233)
#
# `192.168.50.10` was pve01's address and belongs to pve03 now. An address is not
# a name — see the jump-host note in ansible.cfg for what that cost.
#
# Gone, do not re-add:
#   plex 103 / .140  — died with pve01 on 2026-09-03, never rebuilt. plex-gpu 236
#                      is the only Plex. Removed from this file in PET-354, where
#                      it had been sending the capability probe at a dead address.
#   lidarr 100 / .14 — removed in PET-319.
#   filebrowser 102  — decommissioned in PET-82. VMID 102 was REUSED and is
#                      flaresolverr now (see below); the number being free is not
#                      the same as the host being gone.
#
# Live but deliberately unmanaged:
#   flaresolverr 102 / .150 on pve03 — prowlarr references it BY ADDRESS and the
#   container takes its address by DHCP, so the reference is only as stable as the
#   lease. Not added as a host here because managing it means first deciding to
#   pin that address. Recorded in PET-354 rather than fixed silently.
#
# Hosts are declared once under `media` (which carries the connection vars) and
# re-listed in capability groups below. A host in two groups is fine — the
# capability group is what selects the role, so `--limit servarr` hits exactly
# the three apps that share the Servarr update contract.
---
all:
  children:
    media:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        seerr:
          ansible_host: 192.168.50.33   # VMID 101, pve03
        sonarr:
          ansible_host: 192.168.50.15   # VMID 104, pve03
        radarr:
          ansible_host: 192.168.50.16   # VMID 105, pve03
        prowlarr:
          ansible_host: 192.168.50.20   # VMID 109, pve03
        qbittorrent-vpn:
          ansible_host: 192.168.50.21   # VMID 110, pve02 (Gluetun/Proton)

    # plex-gpu (236) is on pve02 and is deliberately OUTSIDE the `media` group:
    # that group's roles assume a configured, claimed server, and this one is
    # installed by bootstrap-plex-gpu.yml instead.
    #
    # ⚠ The stated reason has expired: 236 is the whole Plex tier since 103 died,
    # and it is claimed and serving. The update path reaches it without joining
    # `media` — the Plex play in playbooks/media-roles.yml names plex-gpu, and the
    # update report reads this group too (PET-394). Folding 236 into `media` would
    # also put it under media-base: a real change with a real blast radius, still
    # undecided.
    #
    # It has no .86 leg (pve02 has one NIC, on .50), so .236 is its only LAN
    # address; the TVs reach it over the tailnet at 100.97.96.88 or the pi-1 proxy.
    # It carries a 2xx VMID because it is not part of the legacy 1xx media stack —
    # see the numbering note on module plex_gpu in environments/media/media.tf.
    # Group name deliberately differs from the host name: Ansible warns when a
    # group and a host share one, and the ambiguity is a real trap in --limit.
    gpu-media:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
      hosts:
        plex-gpu:
          ansible_host: 192.168.50.236  # VMID 236, pve02, Quick Sync

    # Capability group: the *arr apps share one install shape (/opt/<App> binary +
    # /var/lib/<app> data + systemd unit) and one update contract (the app's own
    # `builtIn` updater, driven over its REST API), so they are served by a single
    # parametrised `servarr` role. Three since lidarr left in PET-319.
    servarr:
      hosts:
        sonarr:
        radarr:
        prowlarr:

    # The nodes. Used by stack-power.yml, which must reach whichever node holds
    # the guest it is powering, and as an optional recovery jump path (ansible.cfg).
    # pve01 was here until PET-354, pointed at 192.168.50.10 — an address that has
    # answered as pve03 since the rebuild.
    proxmox:
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_proxmox_pedro
      hosts:
        pve02:
          ansible_host: 192.168.50.11
        pve03:
          ansible_host: 192.168.50.10
