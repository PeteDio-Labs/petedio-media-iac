---
- name: Resolve this app's settings
  ansible.builtin.set_fact:
    pc: "{{ plex_connect_apps[inventory_hostname] }}"

- name: Read this app's own API key
  ansible.builtin.slurp:
    src: "{{ pc.config }}"
  register: pc_cfg
  no_log: true

- name: Extract it
  ansible.builtin.set_fact:
    pc_key: "{{ (pc_cfg.content | b64decode | regex_search('<ApiKey>([^<]+)</ApiKey>', '\\1') | first) }}"
  no_log: true

- name: Fail early if the key could not be read
  ansible.builtin.assert:
    that: pc_key | length > 10
    fail_msg: "No usable ApiKey in {{ pc.config }} on {{ inventory_hostname }}."

- name: Read the connections already configured
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pc.port }}/api/v3/notification"
    headers: { X-Api-Key: "{{ pc_key }}" }
    return_content: true
  register: pc_existing
  changed_when: false
  check_mode: false
  no_log: true

# One connection per Plex server, matched by name. A first run after MED-11 finds
# the old "Plex — plex-gpu" connection still aimed at .236, repoints it at plex-gpu,
# and creates "Plex — plex-remote" for the address pve03 answers.
- name: Converge one connection per Plex server
  ansible.builtin.include_tasks: connection.yml
  loop: "{{ plex_connect_targets }}"
  loop_control:
    loop_var: pc_target

# A connection that exists but points nowhere useful is the failure mode here, so
# prove each one round-trips rather than trusting the POST returned 201. A --check
# run sends no write, so it skips the read-back rather than fail on a fine server.
- name: Read the connections back
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pc.port }}/api/v3/notification"
    headers: { X-Api-Key: "{{ pc_key }}" }
    return_content: true
  register: pc_verify
  changed_when: false
  no_log: true

- name: Assert each server has one connection, at its address, set to update the library
  when: not ansible_check_mode
  vars:
    pc_named: >-
      {{ pc_verify.json | selectattr('implementation', 'equalto', 'PlexServer')
         | selectattr('name', 'equalto', plex_connect_name_prefix ~ item) | list }}
    pc_fields: "{{ (pc_named | first | default({})).fields | default([]) }}"
  ansible.builtin.assert:
    that:
      - pc_named | length == 1
      - (pc_fields | selectattr('name', 'equalto', 'host') | map(attribute='value') | first | default('')) == hostvars[item].plex_host_ip
      - (pc_fields | selectattr('name', 'equalto', 'updateLibrary') | map(attribute='value') | first | default(false)) | bool
    fail_msg: >-
      The connection "{{ plex_connect_name_prefix ~ item }}" on {{ inventory_hostname }}
      is missing, duplicated, aimed elsewhere, or not set to update the library.
    success_msg: >-
      {{ inventory_hostname }} notifies {{ item }} at {{ hostvars[item].plex_host_ip }}
      on import, upgrade and rename.
  loop: "{{ plex_connect_targets }}"

# The role leaves a Plex connection it did not create alone. Name it so a stale one
# reads as a decision to make, not as part of the converged state.
- name: Report any other Plex connection
  when:
    - not ansible_check_mode
    - pc_other | length > 0
  vars:
    pc_ours: "{{ plex_connect_targets | map('regex_replace', '^', plex_connect_name_prefix) | list }}"
    pc_other: >-
      {{ pc_verify.json | selectattr('implementation', 'equalto', 'PlexServer')
         | rejectattr('name', 'in', pc_ours) | map(attribute='name') | list }}
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} also holds Plex connections this role does not manage: {{ pc_other | join(', ') }}"
