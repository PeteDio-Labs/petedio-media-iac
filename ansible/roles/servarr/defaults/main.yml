# servarr — shared defaults for sonarr / radarr / prowlarr.
# Per-host overrides live in inventory/host_vars/<app>.yml; the only two that
# genuinely differ are the app name and the API version.
---
# Lowercase app + systemd unit name (sonarr|radarr|prowlarr).
servarr_app: "{{ inventory_hostname }}"
servarr_service: "{{ servarr_app }}"

# Data dir holds config.xml (API key + port). Install dir holds the binary the
# built-in updater swaps out.
servarr_data_dir: "/var/lib/{{ servarr_app }}"
servarr_install_dir: "/opt/{{ servarr_app | capitalize }}"

# Sonarr/Radarr are on API v3; Lidarr/Prowlarr are still v1. Overridden per host.
servarr_api_version: "v3"

# Always talk to the app over loopback — the API key never leaves the container.
servarr_api_host: "127.0.0.1"

# How long to wait for the app to come back after a built-in update. The updater
# extracts a new tree and restarts the service; on these 1–2 core LXCs that
# lands well inside 5 minutes, but Lidarr/Radarr do a DB migration on first boot.
servarr_update_wait_retries: 40
servarr_update_wait_delay: 15

# Declared Prowlarr indexer settings, keyed by the indexer's `name` as Prowlarr
# shows it (PET-296). Empty means "manage no indexer", so sonarr and radarr never
# include tasks/indexers.yml. prowlarr sets it in inventory/host_vars/prowlarr.yml,
# which also says why each value is what it is.
#
# Each entry takes `enable` (required) and `min_seeders` (optional). Leave
# `min_seeders` out and the role never reads or writes that indexer's floor.
servarr_indexers: {}

# The field inside an indexer's `fields` list that holds its minimum seeders.
# Prowlarr builds the name from IndexerTorrentBaseSettings.AppMinimumSeeders,
# nested under the settings' TorrentBaseSettings property (Prowlarr's
# SchemaBuilder camel-cases both and joins them with a dot).
servarr_indexer_seeders_field: "torrentBaseSettings.appMinimumSeeders"
