---
# plex-primary — decides WHICH Plex serves the house, and enforces it.
#
# ⚠ ONLY ONE PLEX EXISTS (PET-354). This role was written for two servers reading
# one library — plex (103) on pve01 and plex-gpu (236) on pve02 — with exactly one
# running, because two live servers is not a redundancy win: clients pick whichever
# they saw last and you cannot tell from the couch which one you are on.
#
# 103 died with pve01 on 2026-09-03 and was not rebuilt. What the role still does
# is assert that plex-gpu is enabled and running. There is no server to fail over
# to, so 236 is a single point of failure for playback until a second one exists.

# The inventory hostname of the server that should be serving.
# Failover was a one-word change (-e plex_primary=plex) and CANNOT WORK now: that
# host is no longer in the inventory. Restoring it needs a second Plex first.
plex_primary: plex-gpu

plex_primary_service: plexmediaserver

# Refuse to demote a server while somebody is mid-episode. Override for a
# planned cutover:  -e plex_primary_force=true
plex_primary_force: false

plex_primary_port: 32400
plex_primary_prefs: >-
  /var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Preferences.xml
