# lidarr — music manager (community-script LXC, :8686).
# CAPTURE-IN-PLACE: asserts the already-running service so `--check` is a no-op.
# The binary install is owned by the community-script installer; we capture the
# service contract, not re-provision it. Config/db live at /var/lib/lidarr on the
# LXC rootfs (local-lvm) — see docs/data-volumes.md.
---
- name: Lidarr service enabled and running
  ansible.builtin.systemd_service:
    name: lidarr
    enabled: true
    state: started
