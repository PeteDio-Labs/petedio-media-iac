# plex — Plex Media Server on plex-gpu (236), apt-installed from repo.plex.tv.
---
plex_package: plexmediaserver
plex_service: plexmediaserver
plex_port: 32400

# Preferences.xml holds PlexOnlineToken, which the session probe needs.
plex_prefs_path: >-
  /var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Preferences.xml

# Refuse to restart Plex while someone is watching, or while the role cannot
# tell whether anyone is (PET-394). Override with `-e plex_update_force=true` to
# update regardless.
plex_update_force: false
