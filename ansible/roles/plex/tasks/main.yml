# plex — Plex Media Server on plex-gpu (LXC 236), installed as an apt package.
# 103 ran this role until it died with pve01 on 2026-09-03; PET-394 pointed it at
# 236, the only Plex since.
#
# Unlike the *arr apps, Plex has no in-app updater on Linux server builds (that
# is a Plex Pass desktop feature), so apt IS the update mechanism.
#
# This role owns two things: the service state and the package upgrade. The apt
# source, its signing key and the scan settings belong to plex-bootstrap, which
# built 236, and the playback limits belong to plex-settings.
#
# Stale-source note, from 103: that host carried TWO Plex apt sources —
#   plexmediaserver.sources -> repo.plex.tv/deb      (current, serves 1.43.x)
#   plex.list               -> downloads.plex.tv/deb (legacy, stuck on 1.42.2)
# If the legacy repo ever outranks the current one (a pin, or the current repo
# 404s), apt would happily "upgrade" Plex backwards. 236 carries only the current
# source (checked 2026-09-10).
#
# ⚠ Captures use regex_findall, never regex_search with a '\1' argument.
# roles/plex-settings records that the group form fails inside folded scalars on
# ansible-core 2.19.13; regex_findall reads the same under any quoting.
---
# NOT unconditionally started. plex-primary.yml runs exactly one Plex at a time,
# and a hardcoded `state: started` here would resurrect a stopped standby — two
# servers on the network, and clients on whichever one they saw last. With 103
# gone there is no standby: plex_primary defaults to plex-gpu, so this keeps 236
# started and enabled. plex-primary owns the decision; this role only honours it.
- name: Plex — service state follows the primary/standby role
  ansible.builtin.systemd_service:
    name: "{{ plex_service }}"
    enabled: "{{ plex_primary | default('plex-gpu') == inventory_hostname }}"
    state: "{{ 'started' if plex_primary | default('plex-gpu') == inventory_hostname else 'stopped' }}"

# ------------------------------------------------------------ version state --
- name: Plex — refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  check_mode: false

- name: Plex — read apt policy for {{ plex_package }}
  ansible.builtin.command: "apt-cache policy {{ plex_package }}"
  register: plex_apt_policy
  changed_when: false
  check_mode: false

- name: Plex — resolve installed and candidate versions
  ansible.builtin.set_fact:
    plex_current: >-
      {{ (plex_apt_policy.stdout | regex_findall('Installed:\s*(\S+)') or ['none']) | first }}
    plex_candidate: >-
      {{ (plex_apt_policy.stdout | regex_findall('Candidate:\s*(\S+)') or ['none']) | first }}

- name: Plex — record update report
  ansible.builtin.set_fact:
    media_update_report:
      service: plex
      mechanism: apt
      current: "{{ plex_current }}"
      available: "{{ plex_candidate if plex_candidate != plex_current else '' }}"
      update_available: "{{ plex_candidate != plex_current and plex_candidate != 'none' }}"

# ------------------------------------------------------------------ upgrade --
- name: Plex — apply update
  when:
    - media_update_apply | bool
    - plex_candidate != plex_current
    - plex_candidate != 'none'
  block:
    # Upgrading restarts the server and kills any in-flight transcode, so look for
    # viewers first, and keep "nobody is watching" apart from "I could not tell".
    # Until PET-394 this guard read any non-200 answer as zero viewers, so a running
    # Plex that rejected the token would have been upgraded mid-stream. That is the
    # bug docs/GOTCHAS.md records for the lifecycle guards, in the update path.
    #
    #   idle     measured nobody, or the server is not running  -> upgrade
    #   in-use   measured somebody                              -> skip
    #   unknown  could not measure                              -> skip
    #
    # -e plex_update_force=true upgrades whatever the guard says. guard.yml holds
    # the classification, and tests/plex-update-guard.yml feeds it recorded answers.
    - name: Plex — is the unit running?
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ plex_service }}"]
      register: plex_unit
      changed_when: false
      failed_when: false
      check_mode: false

    # The token lives in Preferences.xml. Keep it out of logs and out of the URL
    # (query strings land in access logs) by sending it as a header.
    - name: Plex — read PlexOnlineToken
      ansible.builtin.slurp:
        src: "{{ plex_prefs_path }}"
      register: plex_prefs_raw
      when: (plex_unit.stdout | trim) == 'active'
      failed_when: false
      check_mode: false
      no_log: true

    - name: Plex — extract token
      ansible.builtin.set_fact:
        plex_token: >-
          {{ (plex_prefs_raw.content | default('') | b64decode
              | regex_findall('PlexOnlineToken="([^"]+)"') or ['']) | first }}
      when: (plex_unit.stdout | trim) == 'active'
      no_log: true

    # A failed read is not an error here: guard.yml turns it into 'unknown'.
    - name: Plex — count active playback sessions
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ plex_port }}/status/sessions"
        headers:
          X-Plex-Token: "{{ plex_token }}"
        return_content: true
        timeout: 15
      register: plex_sessions
      when: (plex_unit.stdout | trim) == 'active'
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Plex — classify the guard
      ansible.builtin.include_tasks: guard.yml

    - name: Plex — skip update, guard says {{ plex_update_guard }}
      ansible.builtin.debug:
        msg: >-
          SKIPPED: {{ plex_update_guard_reason }}.
          Re-run with -e plex_update_force=true to update anyway.
      when:
        - plex_update_guard != 'idle'
        - not (plex_update_force | bool)

    - name: Plex — say why in the update report
      ansible.builtin.set_fact:
        media_update_report: "{{ media_update_report | combine({'note': 'update skipped, ' ~ plex_update_guard_reason}) }}"
      when:
        - plex_update_guard != 'idle'
        - not (plex_update_force | bool)

    - name: Plex — upgrade {{ plex_package }} to {{ plex_candidate }}
      ansible.builtin.apt:
        name: "{{ plex_package }}"
        state: latest
        only_upgrade: true
        update_cache: false
      when: plex_update_guard == 'idle' or (plex_update_force | bool)
      register: plex_upgraded

    - name: Plex — verify the server answers on the new build
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ plex_port }}/identity"
        return_content: true
        timeout: 15
      register: plex_identity
      until:
        - plex_identity.status is defined
        - plex_identity.status == 200
        - plex_candidate.split('-')[0] in (plex_identity.content | default(''))
      retries: 20
      delay: 6
      changed_when: false
      when: plex_upgraded.changed | default(false)

    - name: Plex — record post-update version
      ansible.builtin.set_fact:
        media_update_report: "{{ media_update_report | combine({
          'current': plex_candidate,
          'available': '',
          'update_available': false,
          'updated': true }) }}"
      when: plex_upgraded.changed | default(false)
