---
# plex-bootstrap — first-run install of Plex on a fresh LXC (236, plex-gpu).
# The `plex` role manages UPDATES on a Plex that already exists; this one puts
# it there. Separate roles because the two run at different times and the
# install must never re-run against 103.

plex_bootstrap_package: plexmediaserver
plex_bootstrap_service: plexmediaserver
plex_bootstrap_port: 32400

# THE REPO AND THE KEY MUST MATCH, AND THE OBVIOUS PAIRING IS THE WRONG ONE.
#
# repo.plex.tv is the current repository and carries 1.43.3. downloads.plex.tv is
# the LEGACY one, stuck on 1.42.2. They are signed by DIFFERENT keys:
#
#   downloads.plex.tv/repo/deb   <- PlexSign.key,  0x97203C7B3ADCA79D, created 2015
#   repo.plex.tv/deb             <- vendored below, 0x06C521790B9CFFDE
#
# PlexSign.key is the only key Plex publishes at a well-known URL, so reaching
# for it is the natural move — and it verifies neither repo on Debian 13. Its
# self-signature uses SHA-1, and trixie's apt verifies with sqv, which rejects
# SHA-1 binding signatures from 2026-02-01:
#
#   Policy rejected non-revocation signature (PositiveCertification)
#   ... SHA1 is not considered secure since 2026-02-01
#
# Debian 12 accepts it, which is why plex 103 (bookworm) never hit this and why
# the first attempt here looked like a Plex outage rather than a policy change.
#
# The current key is not published as a file anywhere obvious. It is on
# keyserver.ubuntu.com, but a keyserver at install time is both a runtime
# dependency and a thing to have to trust, so the key is VENDORED in
# files/plexmediaserver.gpg and its fingerprint asserted before use. The copy was
# taken from plex 103, which has been verifying against this repo in production,
# and matches what the keyserver returns for the same fingerprint.
plex_bootstrap_repo_uri: https://repo.plex.tv/deb/
plex_bootstrap_repo_suite: public
plex_bootstrap_repo_component: main
plex_bootstrap_keyring: /etc/apt/keyrings/plexmediaserver.gpg
plex_bootstrap_key_fingerprint: 6EFFEB478A6559D75C7C4FE706C521790B9CFFDE

# The render node passed in out-of-band (scripts/lxc-oob-236.sh sets dev0).
plex_bootstrap_render_node: /dev/dri/renderD128

# --- library scanning over NFS -------------------------------------------
# ⚠ DO NOT RELY ON AUTO-DETECT. Plex's "update my library automatically" is built
# on inotify, which does not propagate over NFS.
#
# The NFS relationship INVERTED when the rack was rebuilt, so read the original
# finding carefully rather than reusing its wording. It was: pve01 held the disks,
# 236 on pve02 read them over NFS, and 236 never saw a change. Today pve02 holds
# the ZFS pools and 236 sits ON pve02, so 236's library access is LOCAL; the
# writers — sonarr and radarr, now on pve03 — are the NFS clients.
#
# Whether a remote NFS client's write raises a local inotify event on the server
# is kernel-dependent and has NOT been tested here, so auto-detect is still not
# something to depend on. It also does not matter: `plex-connect` drives scans
# from Sonarr/Radarr over HTTP, which is indifferent to filesystems. Keep the
# scheduled sweep as the backstop.
#
# Found the hard way on 2026-09-01 — the first new episode added after 236 went
# live never appeared, while 103 (then still alive, local storage) had it. Both
# mechanisms were off, so nothing was scanning at all.
#
# Scheduled scanning is the only mechanism that works here.
# HOURLY since PET-320, down from every 15 minutes. Sonarr and Radarr now notify
# Plex directly on import (configure-plex-connect.yml), proven end to end: a
# season pack went from search to eleven episodes visible in under three minutes,
# with ONE SECOND between the final import and Plex completing its scan. Sweeping
# a 3.2 TB library over NFS four times an hour to find what a webhook already
# found is wasted work.
#
# ⚠ REDUCED, NOT REMOVED, and the reason matters. inotify does not cross NFS, so
# 236 cannot notice a file on its own. The notification only fires for what the
# *arr apps import — a hand-copied file, a restore, or anything added by another
# tool has NO other detection path. Hourly is the backstop for exactly that.
plex_bootstrap_scheduled_scan: true
plex_bootstrap_scan_interval: 3600    # seconds; hourly
plex_bootstrap_fsevent_scan: false    # inotify — useless over NFS, off to be explicit
