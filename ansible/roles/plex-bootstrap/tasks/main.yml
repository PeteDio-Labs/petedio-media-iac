---
- name: Install the packages needed to add an apt repository
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ plex_bootstrap_keyring | dirname }}"
    state: directory
    mode: "0755"

# Vendored rather than downloaded: the key that signs repo.plex.tv is not
# published at a well-known URL, and the one that IS published (PlexSign.key)
# signs only the legacy repo and is rejected by Debian 13's sqv for using SHA-1.
# See defaults/main.yml for the full account.
- name: Install the Plex signing key
  ansible.builtin.copy:
    src: plexmediaserver.gpg
    dest: "{{ plex_bootstrap_keyring }}"
    mode: "0644"
    owner: root
    group: root

# Pin it. A copy step alone would happily install whatever the file contained.
- name: Read the installed keyring's fingerprints
  ansible.builtin.command: gpg --show-keys --with-colons {{ plex_bootstrap_keyring }}
  register: plex_key_show
  changed_when: false

- name: Assert the keyring is the expected Plex key
  ansible.builtin.assert:
    that: plex_bootstrap_key_fingerprint in plex_key_show.stdout
    fail_msg: >-
      {{ plex_bootstrap_keyring }} does not contain {{ plex_bootstrap_key_fingerprint }}.
      Refusing to configure an apt repository against an unrecognised signing key.

# deb822 format, matching plex 103. The one-line `deb [signed-by=...]` form works
# too, but 103 is the reference and a diff between the two hosts should be empty.
- name: Add the Plex apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/plexmediaserver.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ plex_bootstrap_repo_uri }}
      Suites: {{ plex_bootstrap_repo_suite }}
      Components: {{ plex_bootstrap_repo_component }}
      Signed-By: {{ plex_bootstrap_keyring }}

# Remove the legacy one-line file if an earlier run of this role left it behind.
# Left in place it shadows the repo above with a 1.42.2 candidate that fails to
# verify, and apt reports the failure for the whole update rather than that file.
- name: Remove the legacy plexmediaserver.list if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/plexmediaserver.list
    state: absent

- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Plex Media Server
  ansible.builtin.apt:
    name: "{{ plex_bootstrap_package }}"
    state: present

- name: Ensure Plex is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ plex_bootstrap_service }}"
    enabled: true
    state: started

# ------------------------------------------------------------- verification --
# Everything below proves the GPU and the library are actually usable. Without
# these the play goes green on a Plex that transcodes in software and sees an
# empty library, which is precisely the outcome this whole change exists to
# avoid.

# Set by scripts/lxc-oob-236.sh (`pct set 236 -dev0 ...`), not by Terraform.
- name: Assert the render node reached the container
  ansible.builtin.stat:
    path: "{{ plex_bootstrap_render_node }}"
  register: plex_render
  failed_when: not plex_render.stat.exists

- name: Read the plex service user's groups
  ansible.builtin.command: id plex
  register: plex_id
  changed_when: false

# Terraform passes the device in with gid 44 (video). If Plex is not in that
# group it cannot open the render node, and Plex reports no hardware transcoding
# with no error a user would ever find.
- name: Assert the plex user can open the render node
  ansible.builtin.assert:
    that: "'(video)' in plex_id.stdout"
    fail_msg: >-
      plex is not in the video group ({{ plex_id.stdout }}), so it cannot open
      {{ plex_bootstrap_render_node }}. The device is passed through with gid 44
      by scripts/lxc-oob-236.sh, not by Terraform — Proxmox gates device
      passthrough behind root@pam. Re-run that script.

- name: Assert the media library is mounted and populated
  ansible.builtin.find:
    paths: /mnt/media
    file_type: directory
    recurse: false
  register: plex_media
  failed_when: plex_media.matched | int == 0

# ------------------------------------------------- library scanning over NFS --
- name: Read the Plex token for the settings API
  ansible.builtin.slurp:
    src: "/var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Preferences.xml"
  register: plex_scan_prefs
  no_log: true
  check_mode: false

- name: Extract the token
  ansible.builtin.set_fact:
    plex_scan_token: >-
      {{ (plex_scan_prefs.content | b64decode
          | regex_search('PlexOnlineToken="([^"]+)"', '\1') | first | default('')) }}
  no_log: true

# Scheduled scanning, because inotify cannot see NFS writes. Without this the
# server never notices new media and the failure is silent — the library simply
# stays as it was, which reads as "the download broke" rather than "nothing is
# scanning".
- name: Turn on scheduled library scanning
  when: plex_scan_token | length > 0
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ plex_bootstrap_port }}/:/prefs?ScheduledLibraryUpdatesEnabled={{
      1 if plex_bootstrap_scheduled_scan else 0 }}&ScheduledLibraryUpdateInterval={{
      plex_bootstrap_scan_interval }}&FSEventLibraryUpdatesEnabled={{
      1 if plex_bootstrap_fsevent_scan else 0 }}
    method: PUT
    headers:
      X-Plex-Token: "{{ plex_scan_token }}"
    status_code: [200]
  no_log: true
  changed_when: true

- name: Read the scanning settings back
  when: plex_scan_token | length > 0
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ plex_bootstrap_port }}/:/prefs"
    headers:
      X-Plex-Token: "{{ plex_scan_token }}"
    return_content: true
  register: plex_scan_check
  changed_when: false
  no_log: true

# A silent no-op here is the whole failure mode, so prove the setting stuck
# rather than trusting the PUT returned 200.
- name: Assert scheduled scanning really is on
  when:
    - plex_scan_token | length > 0
    - plex_bootstrap_scheduled_scan | bool
  ansible.builtin.assert:
    that:
      - plex_scan_check.content is search('ScheduledLibraryUpdatesEnabled" [^>]*value="1"')
    fail_msg: >-
      ScheduledLibraryUpdatesEnabled did not stick. Without it this server never
      notices new media, because inotify does not work over NFS.
    success_msg: >-
      Scheduled scanning on, every {{ plex_bootstrap_scan_interval }}s.

- name: Report what to do next
  ansible.builtin.debug:
    msg:
      - "Plex is running on port {{ plex_bootstrap_port }} with {{ plex_media.matched }} library folders visible."
      - "Render node present: {{ plex_bootstrap_render_node }}"
      - "Claim the server at http://{{ ansible_host }}:{{ plex_bootstrap_port }}/web over the LAN or tailnet,"
      - "then enable Settings > Transcoder > 'Use hardware acceleration when available'."
