# prowlarr — indexer manager (community-script LXC, :9696).
# CAPTURE-IN-PLACE: asserts the already-running service state so `--check` is a
# no-op. The binary install itself is owned by the community-script installer;
# we don't re-provision it here — we capture the service contract + (later) the
# config. Extend with config-file management when the *arr config is templated.
---
- name: Prowlarr service enabled and running
  ansible.builtin.systemd_service:
    name: prowlarr
    enabled: true
    state: started
