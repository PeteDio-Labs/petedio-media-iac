# Is anyone watching? Stopping Plex mid-stream kills the playback and any
# in-flight transcode. Token comes from Preferences.xml and is sent as a header,
# never in the query string.
#
# This file COLLECTS the answers and nothing else. classify-plex.yml turns them
# into media_in_use_state, and tests/media-lifecycle-plex-probe.yml feeds that
# file recorded answers (PET-456). Keep the split: classification that can only
# be reached through a live systemctl and a live HTTP call is classification
# nothing can test, and the three-way verdict below is the part that matters.
#
# THREE outcomes, not two. "Plex did not answer" is not "nobody is watching" —
# see docs/GOTCHAS.md § "The in-use guards fail open". The previous version never
# checked the status code at all: with `failed_when: false`, ANY failure (rotated
# token, 401, connection refused, Plex mid-restart) left `.content` empty, the
# regex matched nothing, `default('0')` won, and the guard reported idle — that
# is, it authorised the stop it exists to prevent, against the one service whose
# own comment says a mid-stream stop kills the transcode.
---
- name: Plex — is the unit even running?
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ media_service_unit }}"]
  register: lifecycle_plex_unit
  changed_when: false
  failed_when: false
  check_mode: false

- name: Plex — read PlexOnlineToken
  ansible.builtin.slurp:
    src: "{{ plex_prefs_path }}"
  register: lifecycle_plex_prefs
  when: (lifecycle_plex_unit.stdout | default('') | trim) == 'active'
  check_mode: false
  failed_when: false
  no_log: true

# A failed read is not an error here: classify-plex.yml turns it into 'unknown'.
#
# `check_mode: false` is not decoration. uri does not support check mode, so
# without it a --check run SKIPS this task, the register carries no status, and
# the guard classifies 'unknown' — which refuses the stop. A check run that
# cannot even rehearse the stop is not a rehearsal (PET-456).
- name: Plex — count active playback sessions
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ plex_port }}/status/sessions"
    headers:
      X-Plex-Token: >-
        {{ (lifecycle_plex_prefs.content | default('') | b64decode
            | regex_search('PlexOnlineToken="([^"]+)"', '\1') | first | default('')) }}
    return_content: true
    timeout: 15
  register: lifecycle_plex_sessions
  when: (lifecycle_plex_unit.stdout | default('') | trim) == 'active'
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true # the token rides in the headers

- name: Plex — classify the probe
  ansible.builtin.include_tasks: classify-plex.yml
