# media-lifecycle — bring an individual media host's service up or down.
# The ORDER across hosts is the playbooks' job (stack-up / stack-down); this role
# only knows how to stop/start one host and prove it came back.
---
# started | stopped — set by the calling play.
media_lifecycle_state: started

# systemd | compose. Per host in host_vars/.
media_service_kind: systemd

# systemd unit name. Defaults to the inventory hostname, which is correct for
# the four *arr apps and seerr; plex overrides it (plexmediaserver).
media_service_unit: "{{ inventory_hostname }}"

# TCP port used to prove the service is actually serving after a start. A port
# check needs no API key and works uniformly across all seven hosts.
media_health_port: 0
media_health_timeout: 180

# Refuse to stop a host that is actively in use (Plex streaming, qBittorrent
# downloading). Override with -e media_lifecycle_force=true.
media_lifecycle_force: false

# The guard verdict. THREE states, and the third is the one that matters:
#   idle     — measured, nothing in use        -> safe to stop
#   in-use   — measured, something is in use   -> skip, and say what
#   unknown  — COULD NOT MEASURE               -> refuse, and say why
#
# 'unknown' used to be folded into 'idle', so an unreachable service authorised
# the very stop the guard exists to prevent. When a check's job is to withhold
# permission, "I don't know" has to resolve to "no".
#
# The default is 'idle' because only plex and qbittorrent-vpn run a guard at all
# (see tasks/main.yml). The other five hosts have no in-use concept and must stay
# freely stoppable — they are not 'unknown', there is simply nothing to ask.
media_in_use_state: idle
media_in_use_reason: "no in-use check applies to this host"
