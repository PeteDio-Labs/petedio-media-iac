# qbittorrent-vpn 110 — gluetun (ProtonVPN WireGuard) + qbittorrent + a
# port-sync sidecar, as a docker compose stack.
---
qbit_dir: /opt/qbittorrent-vpn
qbit_compose_file: /opt/qbittorrent-vpn/docker-compose.yml
qbit_env_file: /opt/qbittorrent-vpn/.env

# IN-CONTAINER url — reached with `docker exec {{ qbit_container }} curl …`, never
# from the host. The WebUI is published through Docker, so a host-origin request
# is SNAT'd to the bridge gateway and falls outside WebUI\AuthSubnetWhitelist;
# in-namespace the source really is 127.0.0.1 and needs no auth. There is no
# WebUI password configured to fall back on. See docs/GOTCHAS.md.
qbit_api: "http://localhost:8080"
qbit_container: qbittorrent

# All three services track floating tags (`:latest`, `alpine:3.20`), so "is
# there an update" is a digest question, not a version-string question: compare
# the local RepoDigest against the registry's current manifest digest.
qbit_health_retries: 30
qbit_health_delay: 10

# ------------------------------------------------------------------- images --
# The two docker.io images are pulled through the homelab registry's
# pull-through cache instead of Docker Hub directly. Anonymous Hub pulls are
# capped at 100/6h per IP, and that cap has already aborted an update run on
# this stack — the pull failed for gluetun and alpine (both docker.io) while the
# image that actually needed updating sat on a different registry.
#
# The cache is on-demand: the first pull of a tag fetches from Hub and stores it,
# later pulls are served locally. The `docker-hub/` prefix is zot's sync
# destination, and note the `library/` segment — Docker's implicit namespace for
# official images has to be spelled out once you address them by full path.
#
# qbittorrent goes through the cache too. lscr.io is not subject to the Hub cap,
# but its burst limiter is aggressive enough that the digest check against it
# intermittently returns nothing — reported honestly as NOT CHECKED, which means
# a real qBittorrent update could sit unnoticed. Caching it makes the update
# check deterministic rather than dependent on someone else's rate limiter.
qbit_registry: "docker.pdlab.dev"
qbit_image_gluetun: "{{ qbit_registry }}/docker-hub/qmcgaw/gluetun:latest"
qbit_image_portsync: "{{ qbit_registry }}/docker-hub/library/alpine:3.20"
qbit_image_qbittorrent: "{{ qbit_registry }}/lscr-io/linuxserver/qbittorrent:latest"

# Pulling restarts the containers. qBittorrent resumes its torrents on restart,
# so this is a courtesy rather than a data-safety gate — but interrupting an
# active download is still rude. Override with -e qbit_update_force=true.
qbit_update_force: false

# --------------------------------------------------------- speed limits ------
# qBittorrent keeps TWO limit profiles — "normal" and "alternative" — and a
# global switch between them (the turtle button in the WebUI). The switch is
# plain runtime state: nothing here ever asserted it, so a single stray click
# survived indefinitely.
#
# That is exactly what happened on 2026-08-14 (PET-297). The stack was found in
# alternative mode with the scheduler DISABLED — so not a time-of-day rule, just
# a turtle left on — capping upload at 10 KB/s. BitTorrent peers reciprocate on
# what you upload, so throttling upload throttles DOWNLOAD too: clearing it took
# the active torrent from 4.85 to 6.5 MiB/s, about +34%.
#
# The reason this is worth converging rather than fixing by hand is the symptom.
# "Downloads are slow" reads as a VPN problem or a bad swarm; it took measuring
# throughput against the tunnel directly to find a config toggle. Assert it, and
# the next occurrence is a diff instead of an afternoon.
qbit_speed_limits_enforce: true

# 0 = unlimited, otherwise BYTES per second (the API is bytes, not KiB).
#
# Upload is deliberately unlimited. Do not "helpfully" cap it: the reciprocity
# effect above means a low upload ceiling costs download throughput, which is
# the trap this whole block exists to prevent. Sustained upload is already
# bounded elsewhere — share limits stop seeding at ratio 0 / 1 minute, so this
# only governs the upload that happens *while* fetching.
qbit_dl_limit: 0
qbit_up_limit: 0

# ------------------------------------------------------------- vpn exit ------
# Country gluetun picks its exit server in. The Proton WireGuard key works with
# any Proton server, so changing this needs no new key and no .conf regeneration
# — but it does mean recreating gluetun, and qbittorrent shares its network
# namespace (see tasks/main.yml). Never change it with a torrent mid-flight.
#
# This lived only in the host's uncommitted .env until PET-295, which meant the
# real exit country existed nowhere in git. It is not a secret — it belongs here
# next to the other plain settings, the way FIREWALL_OUTBOUND_SUBNETS and TZ are
# literals in the compose template.
#
# Switzerland, not Israel. Israel was never chosen for privacy or speed; it was
# just the country the original .conf happened to be generated for, and it cost
# roughly a third of throughput from a US connection (3.97 MB/s through the
# tunnel vs 5.88 MB/s direct, +75 ms). It also has only 4 port-forward-capable
# servers against Switzerland's 18 — and port forwarding is what sustains the
# peer count, so the small pool is its own risk.
#
# Whatever you set here MUST be a country with port-forwarding servers, or
# VPN_PORT_FORWARDING silently gets you nothing and swarm connectivity degrades.
# Confirmed port-forward pools: US 182, Canada 28, UK 32, France 26, Germany 20,
# Switzerland 18, Romania/Sweden 14, Netherlands/Poland/Singapore/Spain 12.
proton_server_countries: Switzerland
