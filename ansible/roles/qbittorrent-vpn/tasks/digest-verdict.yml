# The verdict the update report rests on, split out of main.yml so the test
# suite can include this exact file rather than a copy of it — the same reason
# `guard.yml` is its own file. Everything here is pure: it reads
# `qbit_digests.stdout_lines` and sets facts, touches no host, and needs no
# connection. `tests/qbit-digest-verdict.yml` feeds it recorded rows.
---
# Each row is "<service> <image> <local> <remote>". Jinja has no "compare
# element N to element M of the same row" filter, so the comparison is done as a
# loop condition rather than a filter chain.
- name: qbit — list images whose local digest differs from the registry
  ansible.builtin.set_fact:
    qbit_outdated_images: "{{ qbit_outdated_images | default([]) + [row[1]] }}"
    qbit_outdated_services: "{{ qbit_outdated_services | default([]) + [row[0]] }}"
  loop: "{{ qbit_digests.stdout_lines | map('split', ' ') | list }}"
  loop_control:
    loop_var: row
    label: "{{ row[1] | default(row[0]) }}"
  when:
    - row | length == 4
    - row[2] != 'none'
    - row[3] != 'unknown'
    - row[2] != row[3]

# An image whose remote digest could not be resolved is NOT "up to date" — it is
# unknown. Docker Hub rate-limits anonymous manifest requests (HTTP 429), and
# without this distinction a rate-limited run reports a clean stack when it has
# in fact checked nothing.
- name: qbit — list images whose remote digest could not be resolved
  ansible.builtin.set_fact:
    qbit_unchecked_images: "{{ qbit_unchecked_images | default([]) + [row[1]] }}"
  loop: "{{ qbit_digests.stdout_lines | map('split', ' ') | list }}"
  loop_control:
    loop_var: row
    label: "{{ row[1] | default(row[0]) }}"
  when:
    - row | length == 4
    - row[3] == 'unknown'

# Tolerating a 429 on one image is right; tolerating a registry that answers for
# nothing is not. When every row came back `unknown` the run has checked nothing,
# so it cannot say an update does not exist — and `update_available: false` would
# be a measurement it never made. Fail instead. That is what let the dead
# `docker.pdlab.dev` cache report a clean stack for thirteen days (PET-448).
- name: qbit — fail when not one remote digest could be read
  vars:
    qbit_row_count: >-
      {{ qbit_digests.stdout_lines | map('split', ' ') | map('length')
         | select('equalto', 4) | list | length }}
  ansible.builtin.fail:
    msg: >-
      Read no remote digest for any of the {{ qbit_row_count }} images in this
      stack, so this run cannot say whether an update exists. Unreadable:
      {{ qbit_unchecked_images | default([]) | join(', ') }}. Check that the
      registries in `qbit_image_*` answer, then re-run.
  when:
    - qbit_row_count | int > 0
    - (qbit_unchecked_images | default([]) | length) == (qbit_row_count | int)

# The table stays readable by reporting a count; the image names go in `note`,
# which the report prints in full underneath.
- name: qbit — record update report
  ansible.builtin.set_fact:
    media_update_report:
      service: qbittorrent-vpn
      mechanism: docker-compose
      current: "{{ qbit_digests.stdout_lines | length }} images"
      available: >-
        {{ (qbit_outdated_images | default([]) | length ~ ' behind')
           if (qbit_outdated_images | default([]) | length) > 0 else '' }}
      update_available: "{{ (qbit_outdated_images | default([]) | length) > 0 }}"
      note: >-
        {{ [
             (('behind: ' ~ (qbit_outdated_images | default([]) | join(', ')))
              if (qbit_outdated_images | default([]) | length) > 0 else ''),
             (('NOT CHECKED (registry unreachable / rate-limited): '
               ~ (qbit_unchecked_images | default([]) | join(', ')))
              if (qbit_unchecked_images | default([]) | length) > 0 else ''),
           ] | reject('equalto', '') | join(' | ') }}
