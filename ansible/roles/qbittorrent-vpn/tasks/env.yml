# env.yml — render /opt/qbittorrent-vpn/.env from Vault (PET-453).
#
# The host's .env was written by hand and held four keys. gluetun reads two:
# PROTON_WG_PRIVATE_KEY and PROTON_WG_ADDRESSES. PROTON_SERVER_COUNTRIES has been
# inert since PET-295 moved the exit country to defaults/main.yml, and
# QBIT_WEBUI_PASSWORD matched nothing. This file writes the two live keys from
# kv/services/media/qbittorrent and drops the other two.
#
# WHY THE VAULT CLI, NOT community.hashi_vault. The collection needs the hvac
# Python library inside Ansible's interpreter, and Homebrew's Ansible does not
# ship it. petedio-iac's configure-registry.yml reads Vault through the CLI for
# the same reason.
#
# WHY NO SECRET GOES THROUGH `environment:`. Ansible writes that keyword into the
# shell command it runs, so `ps` shows the value, and so does -vvv output. The
# credentials and the token reach the CLI on stdin instead (PET-110).
#
# WHY THE CLI RUNS WITH AN EMPTY HOME. The CLI sends a token on every request,
# the AppRole login included. It uses VAULT_TOKEN when that is set. Otherwise it
# asks its token helper, which reads ~/.vault-token or runs the helper that
# ~/.vault or VAULT_CONFIG_PATH names. On the Mac, VAULT_TOKEN and ~/.vault-token
# can hold the root token. Both Vault tasks set VAULT_TOKEN empty, HOME to
# /var/empty and VAULT_CONFIG_PATH to /dev/null, so the CLI finds no token to send.
# The login check and the read's guards then turn a login that printed no token
# into a clear failure, not a "permission denied".
#
# In:  qbit_vault_*, qbit_env_file and qbit_env_force, from defaults
# Out: qbit_env_file holding exactly two keys, mode 0600, or a failed play
#
# To converge while Vault is sealed, run with --skip-tags qbit_env. The compose
# render then reads the .env already on the host.
---
- name: qbit env — find the AppRole credential files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ qbit_vault_role_id_file }}"
    - "{{ qbit_vault_secret_id_file }}"
  register: qbit_vault_cred_files
  delegate_to: localhost
  become: false
  check_mode: false

- name: qbit env — fail when a credential file is missing
  ansible.builtin.fail:
    msg: >-
      Missing {{ qbit_vault_cred_files.results | rejectattr('stat.exists')
      | map(attribute='item') | join(' and ') }}. Write the ansible AppRole's
      credentials with petedio-iac's docs/runbooks/vault-seed.md, or set
      SECRETS_DIR to the directory that holds ansible.role_id and ansible.secret_id.
  when: qbit_vault_cred_files.results | rejectattr('stat.exists') | list | length > 0

# Every task from here to the render sets no_log. A failure message prints the
# exit code and stderr, never stdout.
- name: qbit env — log in to Vault as the ansible AppRole
  ansible.builtin.command:
    argv: [vault, write, -field=token, auth/approle/login, "-"]
    stdin: >-
      {{ {'role_id': lookup('ansible.builtin.file', qbit_vault_role_id_file),
          'secret_id': lookup('ansible.builtin.file', qbit_vault_secret_id_file)} | to_json }}
  environment:
    VAULT_ADDR: "{{ qbit_vault_addr }}"
    VAULT_CACERT: "{{ qbit_vault_cacert }}"
    VAULT_TOKEN: ""
    VAULT_CONFIG_PATH: /dev/null
    HOME: /var/empty
  register: qbit_vault_login
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: qbit env — fail when the AppRole login failed
  ansible.builtin.fail:
    msg: >-
      The ansible AppRole could not log in to {{ qbit_vault_addr }}.
      {{ "The login exited 0 but printed no token, so the read has no AppRole token to use."
         if (qbit_vault_login.rc | default(1)) == 0
         else 'rc=' ~ (qbit_vault_login.rc | default('?')) ~ ': '
              ~ ((qbit_vault_login.stderr | default('') | trim) or (qbit_vault_login.msg | default(''))) | truncate(300) }}
      If Vault is sealed, unseal it, or converge without this step using --skip-tags qbit_env.
      If Vault refused the credentials, write fresh ones with petedio-iac's
      docs/runbooks/vault-seed.md.
  when: >-
    (qbit_vault_login.rc | default(1)) != 0
    or (qbit_vault_login.stdout | default('') | trim | length) == 0

# The shell reads the token from stdin and exports it to the CLI alone. It stops
# before the CLI when the token is empty: `read` fails on empty stdin, and `-n`
# fails on a bare newline.
- name: qbit env — read the WireGuard values from Vault
  ansible.builtin.shell:
    cmd: >-
      IFS= read -r VAULT_TOKEN && [ -n "$VAULT_TOKEN" ] && export VAULT_TOKEN &&
      exec vault kv get -format=json {{ qbit_vault_path | quote }}
    stdin: "{{ qbit_vault_login.stdout | trim }}"
  environment:
    VAULT_ADDR: "{{ qbit_vault_addr }}"
    VAULT_CACERT: "{{ qbit_vault_cacert }}"
    VAULT_TOKEN: ""
    VAULT_CONFIG_PATH: /dev/null
    HOME: /var/empty
  register: qbit_vault_read
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: qbit env — fail when the read failed
  ansible.builtin.fail:
    msg: >-
      The ansible AppRole could not read {{ qbit_vault_path }}.
      "permission denied" means the ansible policy no longer reads kv/data/services/*.
      "No value found" means the path is unseeded, so run petedio-iac's
      scripts/seed-qbittorrent-vault.sh. If Vault is sealed, unseal it, or converge
      without this step using --skip-tags qbit_env.
      The CLI exited {{ qbit_vault_read.rc | default('?') }}:
      {{ ((qbit_vault_read.stderr | default('') | trim) or (qbit_vault_read.msg | default(''))) | truncate(300) }}
  when: (qbit_vault_read.rc | default(1)) != 0

- name: qbit env — keep the secret's data
  ansible.builtin.set_fact:
    qbit_wg: "{{ (qbit_vault_read.stdout | from_json).data.data | default({}, true) }}"
  no_log: true

# gluetun's running config, not the .env on disk, decides whether compose
# recreates it. A missing container reads as rc=1, which the verdict calls unknown.
- name: qbit env — read the WireGuard values gluetun runs with
  ansible.builtin.command:
    argv: [docker, inspect, "--format={{ '{{' }}json .Config.Env{{ '}}' }}", gluetun]
  register: qbit_gluetun_env
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

# An import, not an include, so --tags and --skip-tags qbit_env reach these tasks.
- name: qbit env — decide whether the render may restart gluetun
  ansible.builtin.import_tasks: env-verdict.yml

# The file holds the private key, so only root reads it. No diff and no backup,
# because either would copy the key somewhere else.
- name: qbit env — render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ qbit_env_file }}"
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
