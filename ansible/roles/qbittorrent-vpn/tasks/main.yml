# qbittorrent-vpn — assert the VPN torrent stack is running and that qBittorrent
# saves completed downloads in the completed/ folder (not the /downloads root).
# CAPTURE-IN-PLACE: `--check` is a clean no-op once the live config is correct
# (which it is — the path fix was applied out-of-band). The read-only assertions
# run in check mode (check_mode:false) so the drift guard below is always defined.
---
- name: Assert the qBittorrent VPN stack containers are running
  ansible.builtin.command: "docker top {{ item }}"
  loop: "{{ qbit_containers }}"
  changed_when: false
  check_mode: false
  # `docker top` exits non-zero unless the container is running, so this asserts
  # the whole stack is up without mutating anything (never reports "changed").

- name: Detect qBittorrent completed-download path drift
  ansible.builtin.command:
    cmd: "grep -Fxq 'Session\\DefaultSavePath={{ qbit_completed_path }}' {{ qbit_conf }}"
  register: qbit_savepath
  changed_when: false
  failed_when: false
  check_mode: false

# Correcting the path is a stop -> edit -> start sequence, NOT edit-then-restart:
# qBittorrent rewrites its conf on shutdown, so editing while it runs would be
# clobbered on the next stop. This block only fires when drift is detected, so a
# captured (already-correct) host never triggers it and `--check` stays a no-op.
- name: Correct qBittorrent completed-download path (stop -> edit -> start)
  when: qbit_savepath.rc != 0
  block:
    - name: Stop qBittorrent (it persists its conf on shutdown)
      ansible.builtin.command: docker stop qbittorrent
      changed_when: true

    - name: Point DefaultSavePath + SavePath at the completed folder
      ansible.builtin.replace:
        path: "{{ qbit_conf }}"
        regexp: '^(Session\\DefaultSavePath|Downloads\\SavePath)=.*$'
        replace: '\1={{ qbit_completed_path }}'

    - name: Start qBittorrent
      ansible.builtin.command: docker start qbittorrent
      changed_when: true
