# qbittorrent-vpn — the compose stack on LXC 110.
#
# PROVENANCE NOTE: the compose file's header claims "Managed by Ansible — Source:
# infrastructure/ansible/templates/qbittorrent-vpn/docker-compose.yml.j2" and
# refers to "LXC 120". Neither is true any more: that template lived in the
# retired homelab-infra repo (it is in no current clone) and the container is
# 110. So the file on disk is, in practice, unmanaged. This role captures the
# stack's *runtime* contract (services up, images current) without rewriting the
# compose file — templating it here would mean pulling the Proton WireGuard key
# and the qBit WebUI password into this repo's Vault scope first, which is its
# own piece of work. Tracked as follow-up; see README.
#
# Secrets: the WebUI password is read from the host's .env at runtime and never
# leaves the container or lands in a log. .env itself is NOT committed.
---
- name: qbit — compose file present
  ansible.builtin.stat:
    path: "{{ qbit_compose_file }}"
  register: qbit_compose_stat
  check_mode: false

- name: qbit — fail if the compose file is missing
  ansible.builtin.assert:
    that: qbit_compose_stat.stat.exists
    fail_msg: "{{ qbit_compose_file }} not found — the stack is not deployed as expected."

# Keep one copy of whatever was on the host before this role first rendered it.
# The previous file was written by a repo that no longer exists, so if the
# template turns out to differ in some way that matters, this is the only
# reference to diff against.
- name: qbit — preserve the pre-Ansible compose file (once)
  ansible.builtin.copy:
    src: "{{ qbit_compose_file }}"
    dest: "{{ qbit_compose_file }}.pre-ansible"
    remote_src: true
    force: false
    mode: "0644"

- name: qbit — render the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qbit_compose_file }}"
    mode: "0644"
    # `docker compose config` resolves the file AND its .env; a syntax error or a
    # missing variable fails here rather than after the live file is overwritten.
    validate: "docker compose --project-directory {{ qbit_dir }} -f %s config -q"
  register: qbit_compose_rendered

- name: qbit — stack is up
  community.docker.docker_compose_v2:
    project_src: "{{ qbit_dir }}"
    state: present

# ------------------------------------------------------------ speed limits --
# Runs on every converge, not just on update: this is config state, and the
# point is to catch a drift nothing else would surface. See PET-297 and the
# reasoning in defaults/main.yml.
- name: qbit — converge transfer speed limits
  when: qbit_speed_limits_enforce | bool
  block:
    # Same in-namespace rule as the update block below — the WebUI is only
    # reachable from inside gluetun's netns, host-origin requests are SNAT'd
    # outside the whitelist, and there is no password to fall back on.
    #
    # Retried because "stack is up" returns as soon as compose is satisfied,
    # which is before qBittorrent's WebUI is answering.
    - name: qbit — read speed-limit mode
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ qbit_container }}"
          - curl
          - -sS
          - --max-time
          - "15"
          - "{{ qbit_api }}/api/v2/transfer/speedLimitsMode"
      register: qbit_sl_mode
      until: >-
        (qbit_sl_mode.rc | default(1)) == 0
        and (qbit_sl_mode.stdout | default('') | trim) in ['0', '1']
      retries: 6
      delay: 5
      changed_when: false
      failed_when: false
      check_mode: false

    - name: qbit — REFUSING to touch speed limits, mode is unreadable
      ansible.builtin.fail:
        msg: >-
          Could not read the qBittorrent speed-limit mode
          (rc={{ qbit_sl_mode.rc | default('?') }},
          out "{{ (qbit_sl_mode.stdout | default('') | trim)[:40] }}",
          err "{{ (qbit_sl_mode.stderr | default('') | trim)[:40] }}").
          Refusing to guess, because writing a limit blind can throttle the
          stack rather than fix it. Set -e qbit_speed_limits_enforce=false
          to skip.
      when: (qbit_sl_mode.stdout | default('') | trim) not in ['0', '1']

    # qBittorrent has NO "set mode" endpoint — only a toggle. So this has to be
    # conditional on the mode actually reading 1: a blind toggle is not
    # idempotent and would flip a correct config into the broken one every run.
    - name: qbit — switch off alternative speed limits (turtle mode)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ qbit_container }}"
          - curl
          - -sS
          - --max-time
          - "15"
          - -X
          - POST
          - "{{ qbit_api }}/api/v2/transfer/toggleSpeedLimitsMode"
      when: (qbit_sl_mode.stdout | trim) == '1'
      changed_when: true

    # Read AFTER the toggle, not before: /transfer/info reports the limits in
    # force for the CURRENT mode, so reading it while alternative mode was still
    # on would compare against the wrong profile entirely.
    - name: qbit — read current transfer limits
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ qbit_container }}"
          - curl
          - -sS
          - --max-time
          - "15"
          - "{{ qbit_api }}/api/v2/transfer/info"
      register: qbit_xfer
      changed_when: false
      failed_when: false
      check_mode: false

    - name: qbit — REFUSING to touch speed limits, transfer state is unreadable
      ansible.builtin.fail:
        msg: >-
          Could not read /transfer/info (rc={{ qbit_xfer.rc | default('?') }}).
          Refusing to write a limit against unknown state.
      when: not (qbit_xfer.stdout | default('') | trim).startswith('{')

    - name: qbit — parse transfer state
      ansible.builtin.set_fact:
        qbit_xfer_json: "{{ qbit_xfer.stdout | from_json }}"

    - name: qbit — resolve current limits
      ansible.builtin.set_fact:
        qbit_dl_now: "{{ qbit_xfer_json.dl_rate_limit | default(-1) | int }}"
        qbit_up_now: "{{ qbit_xfer_json.up_rate_limit | default(-1) | int }}"

    # Visible in --check, where the command tasks below are skipped rather than
    # reported. Without this a dry run says nothing about the drift it found.
    - name: qbit — report speed-limit drift
      ansible.builtin.debug:
        msg: >-
          mode={{ qbit_sl_mode.stdout | trim }}
          {{ '(alternative — will be switched off)'
             if (qbit_sl_mode.stdout | trim) == '1' else '(normal)' }},
          download {{ qbit_dl_now }} -> {{ qbit_dl_limit }},
          upload {{ qbit_up_now }} -> {{ qbit_up_limit }}
          (0 = unlimited, values in bytes/sec)

    - name: qbit — set global download limit
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ qbit_container }}"
          - curl
          - -sS
          - --max-time
          - "15"
          - -d
          - "limit={{ qbit_dl_limit }}"
          - "{{ qbit_api }}/api/v2/transfer/setDownloadLimit"
      when: qbit_dl_now | int != qbit_dl_limit | int
      changed_when: true

    - name: qbit — set global upload limit
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ qbit_container }}"
          - curl
          - -sS
          - --max-time
          - "15"
          - -d
          - "limit={{ qbit_up_limit }}"
          - "{{ qbit_api }}/api/v2/transfer/setUploadLimit"
      when: qbit_up_now | int != qbit_up_limit | int
      changed_when: true

# ------------------------------------------------------------ version state --
# `docker compose config --images` is the source of truth for what this stack
# runs — no hardcoded image list to drift.
- name: qbit — compare local image digests against the registry
  ansible.builtin.script:
    cmd: "image-digests.sh {{ qbit_dir }}"
  register: qbit_digests
  changed_when: false
  check_mode: false

# Each row is "<service> <image> <local> <remote>". Jinja has no "compare
# element N to element M of the same row" filter, so the comparison is done as a
# loop condition rather than a filter chain.
- name: qbit — list images whose local digest differs from the registry
  ansible.builtin.set_fact:
    qbit_outdated_images: "{{ qbit_outdated_images | default([]) + [row[1]] }}"
    qbit_outdated_services: "{{ qbit_outdated_services | default([]) + [row[0]] }}"
  loop: "{{ qbit_digests.stdout_lines | map('split', ' ') | list }}"
  loop_control:
    loop_var: row
    label: "{{ row[1] | default(row[0]) }}"
  when:
    - row | length == 4
    - row[2] != 'none'
    - row[3] != 'unknown'
    - row[2] != row[3]

# An image whose remote digest could not be resolved is NOT "up to date" — it is
# unknown. Docker Hub rate-limits anonymous manifest requests (HTTP 429), and
# without this distinction a rate-limited run reports a clean stack when it has
# in fact checked nothing.
- name: qbit — list images whose remote digest could not be resolved
  ansible.builtin.set_fact:
    qbit_unchecked_images: "{{ qbit_unchecked_images | default([]) + [row[1]] }}"
  loop: "{{ qbit_digests.stdout_lines | map('split', ' ') | list }}"
  loop_control:
    loop_var: row
    label: "{{ row[1] | default(row[0]) }}"
  when:
    - row | length == 4
    - row[3] == 'unknown'

# The table stays readable by reporting a count; the image names go in `note`,
# which the report prints in full underneath.
- name: qbit — record update report
  ansible.builtin.set_fact:
    media_update_report:
      service: qbittorrent-vpn
      mechanism: docker-compose
      current: "{{ qbit_digests.stdout_lines | length }} images"
      available: >-
        {{ (qbit_outdated_images | default([]) | length ~ ' behind')
           if (qbit_outdated_images | default([]) | length) > 0 else '' }}
      update_available: "{{ (qbit_outdated_images | default([]) | length) > 0 }}"
      note: >-
        {{ [
             (('behind: ' ~ (qbit_outdated_images | default([]) | join(', ')))
              if (qbit_outdated_images | default([]) | length) > 0 else ''),
             (('NOT CHECKED (registry unreachable / rate-limited): '
               ~ (qbit_unchecked_images | default([]) | join(', ')))
              if (qbit_unchecked_images | default([]) | length) > 0 else ''),
           ] | reject('equalto', '') | join(' | ') }}

# ------------------------------------------------------------------ upgrade --
- name: qbit — apply update
  when:
    - media_update_apply | bool
    - (qbit_outdated_images | default([]) | length) > 0
  block:
    # Same guard, same fix, same reason as roles/media-lifecycle's — the WebUI is
    # only reachable from INSIDE the netns. There is no WebUI password (the .env
    # value matches nothing and five tries earn an hour-long IP ban), and a
    # host-origin request is SNAT'd to the bridge gateway, outside
    # WebUI\AuthSubnetWhitelist. See docs/GOTCHAS.md.
    - name: qbit — is anything in the compose project running?
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ qbit_dir }}", ps, -q, --status, running]
      register: qbit_ps
      changed_when: false
      failed_when: false
      check_mode: false

    - name: qbit — count active transfers (in-namespace, no auth needed)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ qbit_container }}"
          - curl
          - -sS
          - --max-time
          - "15"
          - "{{ qbit_api }}/api/v2/torrents/info?filter=downloading"
      register: qbit_active
      changed_when: false
      failed_when: false
      check_mode: false
      when: (qbit_ps.rc | default(1)) == 0 and (qbit_ps.stdout | default('') | trim) != ''

    # -1 meant "could not determine" here before, which was the right idea —
    # and then `when: qbit_active_count | int <= 0` let -1 through as permission
    # to update. Having the third state is worthless unless something acts on it.
    #
    # A stopped stack is 0, not -1: nothing can be downloading when nothing is
    # running, and an update against a down stack is a normal thing to want.
    - name: qbit — resolve active download count
      ansible.builtin.set_fact:
        qbit_active_count: >-
          {{ 0
             if ((qbit_ps.rc | default(1)) == 0 and (qbit_ps.stdout | default('') | trim) == '')
             else ((qbit_active.stdout | from_json | length)
                   if ((qbit_active.rc | default(1)) == 0
                       and (qbit_active.stdout | default('') | trim).startswith('['))
                   else -1) }}

    - name: qbit — REFUSING to update, transfer state is unknown
      ansible.builtin.fail:
        msg: >-
          Could not read the qBittorrent API (rc={{ qbit_active.rc | default('?') }},
          answered "{{ (qbit_active.stdout | default('') | trim)[:60] }}{{ (qbit_active.stderr | default('') | trim)[:60] }}").
          Refusing to update, because "cannot tell" is not "nothing is downloading".
          Re-run with -e qbit_update_force=true to update anyway.
      when:
        - qbit_active_count | int < 0
        - not (qbit_update_force | bool)

    - name: qbit — skip update, downloads in flight
      ansible.builtin.debug:
        msg: >-
          SKIPPED: {{ qbit_active_count }} torrent(s) downloading.
          Re-run with -e qbit_update_force=true to update anyway.
      when:
        - qbit_active_count | int > 0
        - not (qbit_update_force | bool)

    # Pull ONLY the services actually behind, one at a time.
    #
    # `docker compose pull` with no arguments pulls every image in the stack.
    # Two of these three come from docker.io, which rate-limits anonymous pulls
    # (100/6h per IP) — so a 429 on an image that is already current aborts the
    # whole update, including the one image that genuinely needed it. Pulling
    # per-service keeps a throttled-but-current image from blocking an
    # unthrottled-and-stale one, and avoids spending rate-limit budget on
    # images we already know are up to date.
    - name: qbit — pull the outdated images
      ansible.builtin.command:
        cmd: "docker compose pull {{ item }}"
        chdir: "{{ qbit_dir }}"
      loop: "{{ qbit_outdated_services | default([]) }}"
      register: qbit_pulls
      changed_when: qbit_pulls.rc == 0
      failed_when: false
      # `== 0`, not `<= 0`. The old `<= 0` is precisely how -1 ("could not
      # determine") passed for "nothing is downloading, go ahead". -1 without
      # force has already failed the play above; -1 with force lands on the
      # second clause, deliberately.
      when: qbit_active_count | int == 0 or (qbit_update_force | bool)

    - name: qbit — note which pulls failed
      ansible.builtin.set_fact:
        qbit_failed_pulls: >-
          {{ (qbit_pulls.results | default([]))
             | rejectattr('skipped', 'defined')
             | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
             | map(attribute='item') | list }}

    - name: qbit — resolve which services to recreate
      ansible.builtin.set_fact:
        qbit_to_recreate: >-
          {{ (qbit_outdated_services | default([]))
             | difference(qbit_failed_pulls | default([])) }}

    # gluetun is special: qbittorrent and port-sync run with
    # `network_mode: service:gluetun`, i.e. inside gluetun's network namespace.
    # Recreating gluetun creates a NEW namespace, and any container still
    # pointing at the old one is stranded with no network. So a gluetun update
    # must bring its dependents with it — `--no-deps` is exactly wrong there.
    # For any other service, `--no-deps` is right: it avoids dropping the VPN
    # tunnel just to restart qbittorrent.
    - name: qbit — recreate gluetun together with its dependents
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate
        chdir: "{{ qbit_dir }}"
      when: "'gluetun' in qbit_to_recreate"
      register: qbit_recreated_all
      changed_when: true

    - name: qbit — recreate the other updated services in isolation
      ansible.builtin.command:
        cmd: "docker compose up -d --no-deps {{ item }}"
        chdir: "{{ qbit_dir }}"
      loop: "{{ qbit_to_recreate | difference(['gluetun']) }}"
      when: "'gluetun' not in qbit_to_recreate"
      register: qbit_recreated_svcs
      changed_when: true

    - name: qbit — set the recreate flag for the verification steps
      ansible.builtin.set_fact:
        qbit_recreated:
          changed: >-
            {{ (qbit_recreated_all.changed | default(false))
               or ((qbit_recreated_svcs.results | default([])
                    | rejectattr('skipped', 'defined') | list | length) > 0) }}

    # A pull that fails is a real outcome, not a crash: the service keeps running
    # its current image. Surface it loudly, but don't fail the play and abandon
    # the services that DID update.
    - name: qbit — report images that could not be pulled
      ansible.builtin.debug:
        msg: >-
          COULD NOT PULL: {{ qbit_failed_pulls | join(', ') }} — these services
          are still running their current image. Docker Hub rate-limits
          anonymous pulls (100/6h per IP); the durable fix is pointing docker.io
          at the homelab Nexus pull-through cache.
      when: (qbit_failed_pulls | default([]) | length) > 0

    # gluetun must come back healthy or qBittorrent has no network at all — it
    # shares gluetun's namespace. An unhealthy gluetun is a hard failure, not a
    # warning.
    - name: qbit — wait for gluetun and qbittorrent to report healthy
      ansible.builtin.command:
        cmd: docker inspect --format={{ '{{' }}.State.Health.Status{{ '}}' }} {{ item }}
      register: qbit_health
      until: qbit_health.stdout | trim == 'healthy'
      retries: "{{ qbit_health_retries }}"
      delay: "{{ qbit_health_delay }}"
      changed_when: false
      loop:
        - gluetun
        - qbittorrent
      when: qbit_recreated.changed | default(false)

    - name: qbit — confirm the VPN tunnel still holds a public IP
      ansible.builtin.command:
        cmd: docker exec gluetun wget -qO- -T 10 https://ipinfo.io/ip
      register: qbit_vpn_ip
      changed_when: false
      failed_when: qbit_vpn_ip.rc != 0 or (qbit_vpn_ip.stdout | trim | length) == 0
      when: qbit_recreated.changed | default(false)

    - name: qbit — record post-update state
      ansible.builtin.set_fact:
        media_update_report: "{{ media_update_report | combine({
          'available': ((qbit_failed_pulls | default([]) | length) ~ ' behind')
                       if (qbit_failed_pulls | default([]) | length) > 0 else '',
          'update_available': (qbit_failed_pulls | default([]) | length) > 0,
          'updated': true,
          'note': ('VPN egress ' ~ (qbit_vpn_ip.stdout | default('?') | trim))
                  ~ ((' | COULD NOT PULL: ' ~ (qbit_failed_pulls | join(', ')))
                     if (qbit_failed_pulls | default([]) | length) > 0 else '') }) }}"
      when: qbit_recreated.changed | default(false)
