# Regression test for the identity and marker extraction in playbooks/migrate-plex-identity.yml
# and playbooks/reset-plex-gpu.yml, and for the plex-gpu library declaration (MED-11).
#
#   cd ansible
#   ansible-playbook tests/plex-identity-extract.yml
#
# Runs on localhost and touches nothing. It uses the exact filter form the playbooks use.
# `regex_search(..., '\1')` fails under ansible-core 2.20 with "Unknown argument", and the
# `--check` runs never reached the post-start assertions that used it, so this test is the
# first thing to execute that expression.
- name: Plex identity extraction — recorded answers
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../inventory/host_vars/plex-gpu.yml
  vars:
    prefs: '<Preferences MachineIdentifier="abc123" PlexOnlineToken="x"/>'
    identity: '<MediaContainer machineIdentifier="abc123" claimed="1"/>'
    marker: "Migrated.\nsource machine identifier sha256: {{ 'a' * 64 }}\n"
  tasks:
    - name: Preferences.xml yields its identifier
      ansible.builtin.assert:
        that: (prefs | regex_findall('MachineIdentifier="([^"]+)"') | first | default('')) == 'abc123'

    - name: /identity yields its identifier
      ansible.builtin.assert:
        that: (identity | regex_findall('machineIdentifier="([^"]+)"') | first | default('')) == 'abc123'

    - name: The marker yields its hash
      ansible.builtin.assert:
        that: "(marker | regex_findall('sha256: ([0-9a-f]{64})') | first) == 'a' * 64"

    - name: A document with no identifier yields an empty string, not an error
      ansible.builtin.assert:
        that: ('<nothing/>' | regex_findall('machineIdentifier="([^"]+)"') | first | default('')) == ''

    - name: plex-gpu declares the two libraries a reset server needs
      ansible.builtin.assert:
        that:
          - plex_libraries | map(attribute='name') | sort == ['Movies', 'TV Shows']
          - plex_libraries | map(attribute='location') | sort == ['/mnt/media/movies', '/mnt/media/tv-shows']
