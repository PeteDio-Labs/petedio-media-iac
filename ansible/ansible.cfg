# Ansible control config for the media stack. Mac-local control node on the LAN:
# NO ProxyJump by default (the media LXCs are directly reachable on .50/.86).
# Connects as root over the SSH key Terraform installs (id_ed25519_ansible).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
control_path_dir = /tmp/ansible-cp-media
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# Recovery only: if an LXC is unreachable directly, its NODE can serve as a jump
# host. NOT the default (Mac is on the LAN).
#
# ⚠ Pick the node the guest is actually on, and mind that .10 changed hands.
# .10 was pve01's address and belongs to pve03 since the rebuild, so this line
# read "pve01 (.10)" until PET-354 and would have jumped you through a different
# machine than it named. pve03 = 192.168.50.10 (seerr, flaresolverr, sonarr,
# radarr, prowlarr); pve02 = 192.168.50.11 (qbittorrent-vpn, plex-gpu).
# For one run:
#   ansible-playbook ... -e "ansible_ssh_common_args='-o ProxyJump=root@192.168.50.10'"
