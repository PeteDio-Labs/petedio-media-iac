# Ansible control config for the media stack. Mac-local control node on the LAN:
# NO ProxyJump by default (the media LXCs are directly reachable on .50/.86).
# Connects as root over the SSH key Terraform installs (id_ed25519_ansible).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
control_path_dir = /tmp/ansible-cp-media
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# Recovery only: if an LXC is unreachable directly, pve01 (.10) can serve as a
# jump host. NOT the default (Mac is on the LAN). For one run:
#   ansible-playbook ... -e "ansible_ssh_common_args='-o ProxyJump=root@192.168.50.10'"
